      "<div class=\"table-scroll\"><table><tr><td><p><b>Зміст програми</b></p><p><b>Факти. </b>Утворення монополістичних об’єднань в Україні. Земельна реформа П. Столипіна та її вплив на Україну. Консолідація української нації. Створення політичних партій Наддніпрянщини. Самостійницька й автономістська течії в національному русі. Події революції 1905–1907 рр. в Україні. Діяльність українських парламентських громад в І та ІІ Державних Думах. Діяльність «Просвіт». Посилення російського імперського наступу на Україну в 1907–1914 рр.</p><p><b>Характеризувати </b>особливості економічного та соціального розвитку (процес монополізації, розвиток сільського господарства, утворення українських політичних партій, розвиток самостійницької і автономістської течій у національному русі), національно-визвольний рух України в роки російської революції 1905–1907 рр., діяльність українських парламентських громад в І та ІІ Державних Думах Росії, особливості проведення Столипінської аграрної реформи та її запровадження в Україні, діяльність та здобутки вказаних історичних діячів.</p><p><b>Визначати </b>основні тенденції політичного, соціально-економічного розвитку українських земель у складі Російської імперії на початку ХХ ст., причини та наслідки посилення національного гніту в 1907–1914 рр.</p><p><b>Персоналії: </b>Євген Чикаленко, Микола Міхновський, В’ячеслав Липинський.</p></td></tr></table></div>"

      "<div class=\"table-scroll\"><table><tr><td><p><b>Партія</b></p></td><td><p><b>Лідери</b></p></td><td><p><b>Програмні положення та діяльність</b></p></td></tr><tr><td><p><b>Революційна українська партія (РУП), 1900</b></p></td><td><p>Д. Антонович, Б. Камінський, Л. Мацієвич, М. Русов</p></td><td><p>Програма — «Самостійна Україна» М. Міхновського, у якій обґрунтовані історичні права України на самостійне існування своєму народові.</p><p>Новий лідер національного руху — інтелігенція, яка служить ня.</p><p>Метод боротьби — «кривава і безпощадна» війна.</p><p>Пізніше РУП перейшла на засади автономії України у внутрішніх справах, надала перевагу марксистському соціалізму.</p><p>1904 р. — розкол РУП на «Спілку» та УСДРП.</p><p>Пропаганда: часописи «Гасло», «Селянин».</p></td></tr><tr><td><p><b>Українська соціалістична </b><b>партія, 1902</b></p></td><td><p>Б. Ярошевський, М. Меленевський-Басок</p></td><td><p>Кінцева мета — демократична Українська республіка із суспільною власністю на засоби виробництва.</p><p>Укладення «братерського союзу» із соціалістичними партіями Польщі та Росії в боротьбі із самодержавством за самостійність України.</p></td></tr><tr><td><p><b>Українська народна партія (УНП), 1902</b></p></td><td><p>М. Міхновський, О. Макаренко</p></td><td><p>Мета — повна державна самостійність України.</p><p>Встановлення президентської республіки.</p><p>Передача землі у власність селян.</p><p>Надання соціальних гарантій для широких верств населення.</p><p>Пропагандистська діяльність: агітація в громадських організаціях, листи до владних органів з вимогою зняти заборони на українську мову, поширення листівок із закликом боротися проти самодержавства.</p><p>1904 р. в УНП створено воєнізовану організацію «Оборона України», яка мала очолити національне повстання.</p><p>Фактично припинила існування 1909 р. після повальних арештів.</p></td></tr><tr><td><p><b>Українська соціал-демократична спілка («Спілка»), 1904</b></p></td><td><p>М. Меленевський-Басок, О. Скоропис-Йолтуховський</p></td><td><p>Виступала з марксистських позицій.</p><p>Не визнавала збройного постання як методу боротьби.</p><p>Земельне питання має бути вирішено всенародно обраною Конституційною радою.</p><p>1905 р. увійшла до меншовицької фракції РСДРП.</p></td></tr><tr><td><p><b>Українська соціал-демократична робітнича партія (УСДРП), 1905</b></p></td><td><p>М. Порш, В. Винниченко, С. Петлюра</p></td><td><p>Національно-територіальна автономія України у складі демократичної Російської республіки.</p><p>Ліквідація приватної власності.</p><p>Передача великих підприємств та поміщицьких маєтків державі та органам самоврядування.</p><p>Демократичні права і свободи.</p><p>Рівноправність мов у громадських та урядових установах.</p><p>Пропаганда серед селянства, робітників, студентства, солдат; часописи «Праця», «Робітник».</p></td></tr><tr><td><p><b>Українська демократично-радикальна партія (УДРП), 1905</b></p></td><td><p>А. Лотоцький, Є. Чикаленко, Б. Грінченко, С. Єфремов</p></td><td><p>Виникла в результаті злиття Української демократичної партії (УДП) та Української радикальної партії (УРП), утворених 1904 р.</p><p>Мета — установлення в Росії конституційної монархії та федеративного устрою.</p><p>Україна — автономія у складі Росії.</p><p>Збереження приватної власності.</p><p>Демократичні права і свободи.</p><p>Випуск наукової, історичної, етнографічної літератури; часописи «Рідний край», «Громадська думка», «Рада».</p></td></tr></table></div>",

 розстріляли, за іншими, — звільнили з ув’язнення і незабаром знайшли повішеним).</p></td></tr></table></div>"

      "<div class=\"table-scroll\"><table><tr><td><p><b>Джерело</b></p><p><i>З програми РУП: «Часи вишиваних сорочок, свити та горілки минули і ніколи вже не вернуться. Третя Українська інтелігенція стає до боротьби за свій народ, до боротьби кривавої і безпощадної. Вона вірить </i><i>у силу</i><i> свої і національні, і вона виповнить свій обов’язок. Вона виписує на своєму прапорі ці слова: «Одна, єдина, нероздільна, вільна, самостійна Україна від Карпат аж по Кавказ». Вона віддає себе на служіння цьому великому ідеалові, і доки хоч на одному клапті української території пануватиме чужинець, доти українська інтелігенція не покладе оружия, одни всі покоління Українців ітимуть на війну. Війна провадитиметься усіма засобами, і боротьба культурна уважається також відповідною, як і боротьба фізичною силою. Потреба боротьби випливає з факту нашого національного існування».</i></p><p><i>«Десять заповідей УНП»:</i></p><p><i>«1. Одна, єдина, неподільна, від Карпат аж до Кавказу самостійна, вільна, демократична Україна — республіка робочих людей.</i></p><p><i>2. Усі люди — твої братія, але москалі, ляхи, угри, румуни та жиди — се вороги нашого народу, поки вони панують над нами й визискують нас.</i></p><p><i>3. Україна для українців! Отже, вигонь звідусіль з України чужинців-гнобителів.</i></p><p><i>4. Усюди й завсігди уживай української мови. Хай ні дружина твоя, ні діти твої не поганять твоєї господи мовою чужинців-гнобителів.</i></p><p><i>5. Шануй діячів рідного краю, ненавидь ворогів його, зневажай перевертнів-відступників — і добре буде цілому твоєму народові й тобі.</i></p><p><i>6. Не вбивай України своєю байдужістю до всенародних інтересів.</i></p><p><i>7. Не зробися ренегатом-відступником.</i></p><p><i>8. Не обкрадай власного народу, працюючи на ворогів України.</i></p><p><i>9. Допомагай своєму землякові поперед усіх, держись купи.</i></p><p><i>10. Не бери собі дружини з чужинців, бо твої діти будуть тобі ворогами, не приятелей з ворогами нашого народу, бо ти додаєш їм сили й відваги, не накладай укупі з гнобителями нашими, бо зрадником будеш».</i></p></td></tr></table></div>"

і меценат.</b></p><p>Народився в багатій селянській сім’ї на Херсонщині. Навчаючись у Харківському університеті, вступив до української студентської громади і був заарештований та висланий до рідного маєтку за звинуваченням в українському сепаратизмі. Там Чикаленко займався господарством, запроваджуючи новітні технології. Він зажив неабиякого авторитету серед селян завдяки тому, що передавав їм агрономічний досвід і спілкувався українською мовою, а безземельним селянам продав дешево 200 десятин землі. Після смерті 8-річної дочки Чикаленко ушанував її пам’ять премією за найкращу написану популярну історію України. Був одним із провідних членів «Старої громади» (з 1900), ЗУБО та УДРП (з 1905), засновником Товариства українських поступовців (1908). Чикаленко видав популярну працю «Розмови про сільське хазяйство» українською мовою, загальним накладом півмільйона примірників. Також він фінансував видання українських газет, літератури, діяльність громадських організацій. Меценатові належать слова: «Мало любити Україну до глибини душі, треба любити її й до глибини кишені». 1919 р. Чикаленко виїхав до Галичини, згодом мешкав в Австрії та Чехо-Словаччині, де й помер. Заповіт Чикаленка — розвіяти його прах у степах Херсонщини — не виконаний досі.</p></td></tr></table></div>"

      "<div class=\"table-scroll\"><table><tr><td><p><b>Постать в історії</b></p><p><b>Андрей Шептицький</b> (1865–1944) — митрополит Української греко-католицької церкви, громадський діяч.</p><p>Народився на Львівщині у старовинній графській українській родині. Після закінчення університету (він навчався у Кракові, Вроцлаві, Відні, Мюнхені) обрав релігійне служіння. Благословення на те, щоб стати василіянином — греко-католицьким ченцем, — Шептицький отримав від самого Папи Римського. У віці 33 років його призначили Станіславським єпископом. Шептицький першим почав використовувати рідну мову в спілкуванні з вірянами. 1901 р. його урочисто висвятили на Галицького митрополита греко-католицької церкви. Митрополит усіляко підтримував український національний рух і навіть звертався до австрійського уряду за підтримкою у створенні незалежної української держави. Такі погляди призвели до арешту як російською (1914), так і польською владою (1918, 1923). Злочини радянської влади, які торкнулися і родини Шептицьких (було вбито брата з родиною, пограбовано маєток), зумовили сходження на німецьке звільнення в 1941 р. Але митрополит розчарувався в намірах німців, неодноразово виступав з протестами до райхсфюрера СС Гіммлера щодо винищення євреїв, єдиний з католицьких європейських ієрархів, написав листа Папі Римському із засудженням нацизму. За згодою Шептицького євреїв переховували в греко-католицьких монастирях і навіть у митрополичій резиденції; він особисто врятував три сотні єврейських дітей. Митрополит підтримав ідею створення Першої української дивізії «Галичина»: «Немає майже ціни, яку не треба б дати для створення української армії». Помер Андрей Шептицький 1 листопада 1944 р., похований у підземеллі собору Св. Юра у Львові.</p></td><td><img class=\"material-image\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGB const TOTAL=tasks.length,TOPIC_ID='18-19',LS_KEY='hist'+TOPIC_ID+'-progress';
const $=id=>document.getElementById(id),labelsOf=t=>t.labels||['А','Б','В','Г'],correctSet=t=>Array.isArray(t.correct)?t.correct:[t.correct];
let current=0,inTheory=false;const state=tasks.map(()=>({picked:[]}));
function isDone(i){const t=tasks[i],p=state[i].picked;return t.matrix?p.length===4&&p.every(Number.isInteger):p.length===(t.multi||1);}
function isRight(i){const t=tasks[i],p=state[i].picked,c=correctSet(t);return p.length===c.length&&(t.matrix||t.ordered?c.every((x,k)=>p[k]===x):c.every(x=>p.includes(x)));}
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&Array.isArray(s.state)&&s.state.length===TOTAL){s.state.forEach((v,i)=>{if(!v||!Array.isArray(v.picked))return;const t=tasks[i],p=v.picked;if(p.length<=(t.multi||1)&&p.every(x=>(t.matrix&&x===null)||(Number.isInteger(x)&&x>=0&&x<t.options.length))&&(t.matrix||new Set(p).size===p.length))state[i].picked=p;});if(Number.isInteger(s.current))current=Math.max(0,Math.min(TOTAL-1,s.current));}}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify({state,current}));localStorage.setItem('progress-topic-'+TOPIC_ID,JSON.stringify({answered:state.filter((_,i)=>isDone(i)).length,total:TOTAL}));}catch(e){}}
function buildNums(){const box=$('nums');const b=document.createElement('button');b.id='tBtn';b.className='num theory-btn';b.textContent='Т';b.setAttribute('aria-label','Теорія');b.onclick=showTheory;box.appendChild(b);tasks.forEach((_,i)=>{const b=document.createElement('button');b.className='num';b.dataset.i=i;b.textContent=i+1;b.setAttribute('aria-label','Завдання '+(i+1));b.onclick=()=>go(i);box.appendChild(b);});}
function paintNums(){[...$('nums').children].forEach(b=>{if(b.id==='tBtn'){b.className='num theory-btn'+(inTheory?' current':'');return;}const i=+b.dataset.i;b.className='num';if(state[i].picked.length)b.classList.add(isDone(i)?isRight(i)?'correct':'wrong':'answered');if(!inTheory&&current===i)b.classList.add('current');});}
function buildTheory(){const v=$('theoryView');v.innerHTML='<h2 class="theory-title">Теорія</h2><p class="source-note">Матеріал перенесено з наданого документа. Історичні цитати відображають погляди авторів своєї доби, а не схвалення дискримінації чи насильства.</p>';theory.forEach((item,i)=>{const d=document.createElement('div');d.className='theory-block';d.id='theory-'+i;const h=document.createElement('h3');h.textContent=item.h;d.appendChild(h);const ul=document.createElement('ul');item.list.forEach(x=>{const li=document.createElement('li');li.innerHTML=x;ul.appendChild(li);});d.appendChild(ul);v.appendChild(d);});}
function updateToTop(){$('toTop').classList.toggle('show',inTheory&&window.scrollY>200);}
function showTheory(){inTheory=true;$('testView').classList.add('hidden');$('theoryView').classList.remove('hidden');$('counter').textContent='Теорія';paintNums();window.scrollTo({top:0});updateToTop();}
function showTheoryAt(i){showTheory();$('theory-'+i).scrollIntoView({behavior:'smooth',block:'start'});}
function renderExplain(t){const box=$('explain');if(!isDone(current)){box.className='explain hidden';box.innerHTML='';return;}const right=isRight(current),labels=labelsOf(t),c=correctSet(t);const ans=t.matrix?c.map((x,k)=>(k+1)+'–'+labels[x]).join(', '):c.map(x=>labels[x]).join(t.ordered?' → ':', ');box.className='explain '+(right?'good':'bad');box.innerHTML='<div class="score">Правильна відповідь: <b>'+ans+'</b>. Бали: '+(right?1:0)+' з 1. Після показу відповіді змінити її вже не можна.</div><h4>Чому так</h4><p class="why"></p><p class="repeat">Повторити: <a href="#" id="repeatLink"></a></p>';box.querySelector('.why').textContent=t.matrix?c.map((x,k)=>(k+1)+' — '+t.options[x]).join('; ')+'.':t.ordered?'Послідовність за позначками в документі: '+c.map(x=>t.options[x]).join(' → ')+'.':'Правильна відповідь за ключем документа: '+c.map(x=>t.options[x]).join('; ')+'.';if(t.note){const note=document.createElement('p');note.className='key-note';note.textContent=t.note;box.appendChild(note);}const a=$('repeatLink');a.textContent=theory[t.repeat].h;a.onclick=e=>{e.preventDefault();showTheoryAt(t.repeat);};}
function render(){inTheory=false;updateToTop();$('theoryView').classList.add('hidden');$('testView').classList.remove('hidden');const t=tasks[current],p=state[current].picked,labels=labelsOf(t),done=isDone(current),c=correctSet(t);$('counter').textContent='Завдання '+(current+1)+' з '+TOTAL;const q=$('question');q.textContent='';const b=document.createElement('b');b.textContent=t.id+' ';q.append(b,document.createTextNode(t.q));$('answersLabel').textContent=t.matrix?'Установіть відповідності для кожного стовпця:':t.ordered?'Позначте події у правильній послідовності (потрібно обрати 4):':t.multi?'Позначте відповіді (потрібно обрати '+t.multi+'):':'Позначте відповіді:';
const iv=$('questionImages');iv.innerHTML='';(t.images||[]).forEach(src=>{const img=document.createElement('img');img.className='material-image';img.src=src;img.alt='Ілюстрація до завдання '+t.id;iv.appendChild(img);});if(t.gallery){const gal=document.createElement('div');gal.className='question-gallery';t.gallery.forEach(item=>{const f=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src=item.src;img.className='material-image';img.alt='Зображення '+item.label;cap.textContent=item.label;f.append(img,cap);gal.appendChild(f);});iv.appendChild(gal);}
const ul=$('options');ul.innerHTML='';t.options.forEach((text,i)=>{const li=document.createElement('li'),pos=t.ordered?p.indexOf(i):-1;let cls=t.matrix?'option locked':'option'+(p.includes(i)?' selected':'');if(done&&!t.matrix){if(t.ordered){if(pos>=0)cls+=c[pos]===i?' right':' wrong';}else if(c.includes(i))cls+=' right';else if(p.includes(i))cls+=' wrong';cls+=' locked';}li.className=cls;li.tabIndex=t.matrix?-1:0;li.innerHTML='<span class="letter"></span><span class="txt"></span>';li.querySelector('.letter').textContent=/\bright\b/.test(cls)?'✓':/\bwrong\b/.test(cls)?'✕':labels[i];li.querySelector('.txt').textContent=(pos>=0?'['+(pos+1)+'] ':'')+text;if(t.optionImages){const img=document.createElement('img');img.src=t.optionImages[i];img.className='option-image';img.alt='Варіант '+labels[i];li.querySelector('.txt').appendChild(img);}if(!t.matrix){li.setAttribute('role','button');li.setAttribute('aria-disabled',String(done));li.onclick=()=>pick(i);li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(i);}};}ul.appendChild(li);});
const grid=$('answerGrid');grid.innerHTML='';grid.className='answer-grid'+(t.matrix?' matrix':'');function cell(col,label,on,ok,bad,mark,action){const bx=document.createElement('button');bx.className='box'+(done?(ok?' right':bad?' wrong':'')+' locked':on?' on':'');bx.textContent=done?(ok?'✓':bad?'✕':mark):mark;bx.setAttribute('aria-label',label);bx.setAttribute('aria-pressed',String(on));bx.setAttribute('aria-disabled',String(done));bx.onclick=action;col.appendChild(bx);}if(t.matrix){['1','2','3','4'].forEach((cl,ci)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=cl;col.appendChild(b);labels.forEach((L,ri)=>{const on=p[ci]===ri;cell(col,'Для '+cl+' — '+L,on,c[ci]===ri,on&&c[ci]!==ri,L,()=>pickCell(ci,ri));});grid.appendChild(col);});}else{labels.forEach((L,i)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=L;col.appendChild(b);const on=p.includes(i),pos=p.indexOf(i),ok=t.ordered?on&&c[pos]===i:c.includes(i);cell(col,'Відповідь '+L,on,ok,on&&!ok,on?(t.ordered?String(pos+1):'✓'):'',()=>pick(i));grid.appendChild(col);});}renderExplain(t);paintNums();save();}
function pick(i){if(isDone(current))return;const t=tasks[current],s=state[current],k=s.picked.indexOf(i);if(k>=0)s.picked.splice(k,1);else if(t.multi){if(s.picked.length<t.multi)s.picked.push(i);}else s.picked=[i];render();}
function pickCell(ci,ri){if(isDone(current))return;const p=state[current].picked;if(p[ci]===ri)p[ci]=null;else{while(p.length<=ci)p.push(null);p[ci]=ri;}while(p.length&&p[p.length-1]==null)p.pop();render();}
function go(i){current=Math.max(0,Math.min(TOTAL-1,i));render();window.scrollTo({top:0});}
$('skip').onclick=()=>go(current+1>=TOTAL?0:current+1);$('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',updateToTop,{passive:true});document.addEventListener('keydown',e=>{if(inTheory||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1);}});$('total').textContent=TOTAL;buildNums();buildTheory();render();showTheory();
</script></body></html>
