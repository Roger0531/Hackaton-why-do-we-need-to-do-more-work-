<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Теми 31–32. Становлення і творення нової України</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{--cell:36px;--g:#00bc8c;--gd:#00a077;--red:#e74c3c;--box:#303030;--act:#0b5c49;--text:#fff;--muted:#c8c8c8;--bg:#222;--line:#444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px "Lato","Segoe UI",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 24px 60px}
.home{display:inline-flex;gap:8px;padding:9px 18px;border:1px solid var(--g);color:var(--text);text-decoration:none;margin:4px 0 18px}
.home:hover{background:var(--g)}
.top{border-top:2px solid var(--line);margin-bottom:12px}
.meta div{line-height:1.75;font-size:18px}.meta span{color:var(--muted)}
.nums{display:flex;flex-wrap:wrap;gap:13px;margin:26px 0 22px}
.num{width:var(--cell);height:var(--cell);border:1px solid var(--g);background:var(--box);font:inherit;font-size:16px;color:var(--text);cursor:pointer;padding:0}
.num.answered{background:#1d4a40}.num.correct{background:var(--act)}.num.wrong{background:#6b2620;border-color:var(--red)}
.num.current{background:var(--act);box-shadow:0 0 6px 2px rgba(0,188,140,.55)}
.divider{position:relative;text-align:right;margin:30px 0 40px;height:40px}
.divider::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.counter{position:relative;display:inline-block;padding:8px 14px;background:var(--bg);border:1px solid var(--g)}
.question{font-size:18px;margin:0 0 22px;line-height:1.5;white-space:pre-line}
.question em{display:block;margin-top:12px;color:var(--muted);font-size:16px}
.options{margin:0 0 30px;padding:0;list-style:none}
.option{display:flex;gap:8px;margin:0 0 6px;cursor:pointer}
.letter{background:var(--box);width:var(--cell);height:var(--cell);flex:0 0 var(--cell);display:flex;align-items:center;justify-content:center;font-weight:700}
.txt{font-size:18px;line-height:1.4;padding-top:6px}
.option.selected .letter{background:var(--act);box-shadow:inset 0 0 0 1px var(--g)}
.option.right .letter{background:var(--g)}.option.wrong .letter{background:var(--red)}
.option.locked{cursor:default}
.lbl{font-size:18px;margin:0 0 10px}
.grid{display:flex;gap:7px;margin-bottom:26px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.col b{width:var(--cell);text-align:center}
.box{width:var(--cell);height:var(--cell);border:1px solid #555;border-radius:4px;background:var(--box);cursor:pointer;color:var(--text);padding:0;font:inherit}
.box.on{background:var(--act);border-color:var(--g)}.box.right{background:var(--g);border-color:var(--g)}.box.wrong{background:var(--red);border-color:var(--red)}
.btn{display:block;width:212px;height:43px;border:0;font:inherit;color:#fff;background:var(--g);cursor:pointer}
.btn:hover{background:var(--gd)}
.explain{margin-top:24px;padding:18px 20px;border-left:4px solid var(--g);background:var(--box);line-height:1.55}
.explain.bad{border-left-color:var(--red)}
.explain h4{margin:16px 0 4px;font-size:17px;color:var(--g)}.explain .why{margin:0}.explain .rep{margin:16px 0 0;font-size:15px;color:#9a9a9a}.explain .rep a{color:var(--g);text-decoration:underline}
.hidden{display:none}
.t-title{font-size:24px;margin:0 0 6px}
.tb{padding:18px 0;border-top:1px solid var(--line)}
.tb h3{margin:0 0 8px;font-size:18px;color:var(--g)}
.tb p,.tb ul{margin:0;font-size:18px;line-height:1.6;color:var(--muted)}
.tb ul{padding-left:22px}.tb li{margin:0 0 6px}.tb b{color:var(--text)}
.tb blockquote{margin:0;padding:10px 14px;border-left:4px solid var(--g);background:var(--box);color:var(--muted);font-style:italic}
.btn:focus-visible,.num:focus-visible,.box:focus-visible,.option:focus-visible{outline:3px solid #3498db;outline-offset:2px}
.to-top{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--g);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s,transform .2s,visibility .2s,background .15s;z-index:50}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{background:var(--gd)}
.to-top:focus-visible{outline:3px solid #3498db;outline-offset:3px}
@media(max-width:560px){:root{--cell:32px}.wrap{padding:12px 14px 40px}.nums{gap:9px}.btn{width:100%}}

<script>
const LETTERS=["А","Б","В","Г"];
/* correct: індекс (0=А) або масив; multi — скільки відповідей; labels — підписи */
const tasks=[
{id:"31-32.2.",q:"Яке з тверджень характеризує економічний розвиток України початку 1990-х років?",o:["почалася розбудова соціально орієнтованої ринкової економіки, що сприяло покращенню життєвого рівня громадян","завдяки міжнародним кредитам Україна змогла безболісно перейти до ринкових цін на енергоносії","політика «шокової терапії» різко погіршила становище населення, але за три роки закладені основи прозорої ринкової економіки","різко скоротилось виробництво, були розірвані традиційні господарські зв'язки, гіперінфляція призвела до падіння життєвого рівня"],c:3},
{id:"31-32.3.",q:"Зображена грошова одиниця є свідченням",note:"Ілюстрація: банкноти номіналом 1 000 000 (НБУ, 1995).",o:["зростання українського бюджету в першій половині 1990-х років","гіперінфляції","переходу на бартерні операції","формування фінансово-промислових груп"],c:1},
{id:"31-32.4.",q:"Який характер мала воєнна доктрина України, ухвалена 1993 р.: «Стратегічним завданням України… є захист її державного суверенітету і політичної незалежності, збереження територіальної цілісності та недоторканності кордонів»?",o:["наступальний","агресивний","оборонний","пацифістський"],c:2},
{id:"31-32.5.",q:"Чим була спричинена цитована постанова Кабінету Міністрів України 1992 р.?\n\n«…Міністерству економіки України… передбачити зменшення вивезення з Кримської АРСР місцевих будівельних матеріалів, зокрема залишити в розпорядженні республіки в наступному році не менше 75 % каменю-черепашнику і паленої цегли».",o:["необхідністю забезпечити житлом російських військових","масовим поверненням на історичну батьківщину кримських татар","зростанням будівельної галузі","проголошенням незалежності Криму"],c:1},
{id:"31-32.9.",q:"Коли було ухвалено цитований документ?\n\n«Україна є суверенна і незалежна, демократична, соціальна, правова держава. …Україна є унітарною державою. …Людина, її життя і здоров'я, честь і гідність, недоторканність і безпека визнаються в Україні найвищою соціальною цінністю…»",o:["16 липня 1990 р.","24 серпня 1991 р.","28 червня 1996 р.","23 січня 2005 р."],c:2},
{id:"31-32.10.",q:"Укажіть цитований документ.\n\n«Російська Федерація, Сполучене Королівство… та Сполучені Штати Америки підтверджують Україні їхні зобов'язання згідно з принципами Заключного акта НБСЄ поважати незалежність і суверенітет та існуючі кордони України».",o:["Будапештський меморандум","Угода про асоціацію з ЄС","Харківські угоди","Мінська угода"],c:0},
{id:"31-32.12.",q:"Коли було порушено договір, про який ідеться в завданні 31-32.10?",o:["1997 року","2004 року","2008 року","2014 року"],c:3},
{id:"31-32.14.",q:"Про яку подію писала українська газета?\n\n«Досі залишається нез'ясованою логіка поведінки Володимира Путіна, який натиснув на гальма за 102 метри від державного кордону України. На це вплинули аж ніяк не усвідомлення міжнародних норм… а ракетні стрільби наших літаків у Керченській протоці, та ще — можлива міжнародна реакція на територіальні претензії з боку Росії».",o:["анексію Криму","організацію і проведення Росією незаконного референдуму в Криму","вибори президента Криму","будівництво Росією дамби через Керченську протоку до острова Тузла"],c:3},
{id:"31-32.15.",q:"«…Верховний Суд України, визнавши результати другого туру президентських виборів недійсними та скасувавши їх, ухвалив рішення про переголосування, що в народі стали називати третім туром…»\n\nХто був обраний Президентом України внаслідок цих подій?",o:["Леонід Кучма","Віктор Янукович","Віктор Ющенко","Петро Порошенко"],c:2},
{id:"31-32.16.",q:"«За допомогою відкріпних талонів, голосувань на закритих дільницях, за рахунок голосувань на дому команда Януковича планомірно досягла потрібного результату. Знання точної кількості відкріпних талонів, виїзних голосувань та обсяги інших маніпулятивних технологій зіставляли з даними екзит-полів і таким чином заздалегідь знали, який буде отримано результат».\n\nУ тексті йдеться про",o:["причини Помаранчевої революції","сутність Помаранчевої революції","результати Помаранчевої революції","джерела Помаранчевої революції"],c:0},
{id:"31-32.17.",q:"Яка цитата характеризує політичну ситуацію першої половини 1990-х років?",o:["«…відведення всього важкого озброєння обома сторонами на рівні відстані з метою створення зони безпеки шириною мінімум 50 км один від одного для артилерійських систем калібром 100 мм і більше…»","«замовників убивства журналіста Георгія Гонгадзе не можна встановити лише зі слів екс-генерала МВС Олексія Пукача, якого засудили до довічного ув'язнення…»","«…вона стала першою Конституцією незалежної України, закріпивши правові основи нової держави, її суверенітет і територіальну цілісність… Людина, її життя і здоров'я, честь і гідність… визнаються найвищою соціальною цінністю»","«особливу тривогу викликали висловлювання віце-президента Росії О. Руцького, який… закликав до виходу Криму зі складу України… Президент Росії Б. Єльцин підписав Указ про перехід під юрисдикцію РФ всього Чорноморського флоту…»"],c:3},
{id:"31-32.18.",q:"Закінчіть вислів ексголови Верховної Ради В. Литвина.\n\n«Сьогодні можна скільки завгодно говорити про політичний характер рішень Верховної Ради і Верховного Суду щодо визнання недійсними результатів другого туру голосування… Але при цьому не слід забувати, що саме вони відкрили єдиний за даних обставин — правовий і легітимний — вихід, розрядили гранично напружену політичну атмосферу і стали тим проблиском надії, що дав змогу…»",o:["…протистояти анексії Криму і поширенню сепаратистських рухів на Сході України","…отримати Україні законно обраного президента і розпочати відновлення контролю над територіями самопроголошених ЛНР і ДНР","…розпочати переговори про входження України до Ради Європи","…відступити від безодні громадянського конфлікту, зберегти державну незалежність і територіальну цілісність України"],c:3},
{id:"31-32.19.",q:"Результатом яких подій стала описана ситуація?\n\n«…23 листопада 2004 р. … Віктор Ющенко з парламентської трибуни, тримаючи руку на Острозькій Біблії, зачитав присягу Президента України…»",o:["«касетного скандалу»","Помаранчевої революції","«Мовного майдану»","Революції Гідності"],c:1},
{id:"31-32.20.",q:"«Для більшості українців новий президент асоціювався з двома речами: по-перше, вульгарними за розмірами витратами на життєдіяльність першої особи в державі, по-друге, невластивою сильним людям мстивістю. Резиденції в Межигір'ї та Криму…»\n\nЧим відзначився згаданий президент?",o:["розірвав угоду про оренду баз Чорноморського флоту Росії в Криму","надав звання Героя України Степанові Бандері і Романові Шухевичу","визнав неконституційними зміни до Конституції 2004 року і відновив дію Конституції 1996 р.","запровадив кримінальну відповідальність за невизнання Голодомору"],c:2},
{id:"31-32.21.",q:"Про яку тогочасну правлячу партію йдеться в тексті?\n\n«Цим законопроектом правляча партія… здійснює замах на найсвятіше українського народу — на його мову… надання регіонального статусу російській мові та ще 17 мовам національних меншин є нічим іншим, як спробою узаконити русифікацію України».",o:["Комуністичну партію України","«Європейську солідарність»","Партію регіонів","Блок Юлії Тимошенко"],c:2},
{id:"31-32.22.",q:"Що не характеризує Харківські угоди (2010 р.)?",o:["термін перебування Чорноморського флоту РФ в Криму подовжено до 2042 року з можливістю автоматичного подовження","оплата за оренду баз складалася з щорічних платежів і коштів від знижки на російський газ","угода посилювала економічну і політичну залежність України від РФ","укладення і ратифікація угоди стали передумовою Революції Гідності"],c:3},
{id:"31-32.23.",q:"Якій події присвячено плакат?",note:"Ілюстрація: плакат із цифрою 21, пам'ятником Незалежності та написом «ЛИСТОПАДА».",o:["Дню Збройних сил України","перемозі Помаранчевої революції","початку Євромайдану","підписанню Договору про асоціацію з Євросоюзом"],c:2},
{id:"31-32.24.",q:"Про які випробування йдеться у спогадах учасника Євромайдану?\n\n«І ось 22 лютого повідомили, що Янукович утік… Ми тоді думали, що це кінець, але, на жаль, це був лише початок усіх випробувань, які українці повинні пережити, щоб зберегти свою свободу і незалежність».",o:["анексію Криму РФ і початок російсько-української війни","фальсифікацію результатів президентських виборів","світову економічну кризу","розстріл Небесної Сотні"],c:0},
{id:"31-32.27.",q:"За словами С. Лойка, «саме тут Кремль обламав свої вовчі зуби… Люди перетворювалися на кіборгів…». Про яке місце пише кореспондент?",o:["майдан Незалежності","Дебальцеве","Іловайськ","Донецький аеропорт"],c:3},
{id:"31-32.28.",q:"Зі звіту Міністерства оборони України: «Офіцери ЗС РФ неодноразово відтягували час проходу через так званий зелений коридор… Зрештою, російське командування підтвердило вихід сил АТО із зачохленим озброєнням. За цей час підрозділи збройних сил РФ займали вигідні позиції та під час виходу і впритул розстріляли колони українських військ…»\n\nЩо стало наслідком цих подій?",note:"Частину тексту в джерелі спотворено — цитату наведено неточно.",o:["укладення Мінського протоколу (Мінськ-1)","втрата Україною Дебальцевого","обрання Президентом України Петра Порошенка","запровадження міжнародних санкцій проти Росії"],c:1},
{id:"31-32.29.",q:"Назву якого владного органу пропущено в тексті?\n\n«______ визнає Російську Федерацію державою-агресором та закликає міжнародних партнерів України: не допустити безкарності винних за злочини проти людяності, вчинені від початку російської агресії проти України…; визнати Російську Федерацію державою-агресором, що всебічно підтримує тероризм…, а так звані «ДНР» і «ЛНР» визнати терористичними організаціями».",o:["Верховна Рада України","Президент України","Кабінет Міністрів України","Верховний Суд України"],c:0},
{id:"31-32.30.",q:"Який термін доречно вжити для характеристики події, зображеної на плакаті?",note:"Ілюстрація: плакат — тарілка з контуром території України, виделка і ніж.",o:["«окупація»","«анексія»","«сепаратизм»","«возз'єднання»"],c:1},

{id:"31-32.32.",q:"Які поняття й терміни характеризують 2014–2015 роки?",o:["«стагнація», «гіперінфляція», «рейдерство»","«Помаранчева революція», «СОТ», «президентські вибори»","«гривня», «фінансово-промислові групи», «торговельні війни»","«анексія», «АТО», «тимчасово окупована територія»"],c:3},
{id:"31-32.33.",q:"Кому присвячено цей плакат?",note:"Ілюстрація: плакат з написом «КІБОРГИ» та постаттю воїна-кіборга.",o:["героям Небесної Сотні","українським воїнам, загиблим під Іловайськом","українським захисникам Донецького аеропорту","учасникам волонтерського руху"],c:2},
{id:"31-32.37.",q:"«Це був протест не лише проти показової спроби принизити й упокорити українське суспільство — демонстративно не підписувати Угоду про асоціацію з ЄС. Це був вибух протесту проти дикого цинізму й аморальності тогочасної влади в Україні».\n\nВ уривку йдеться про",o:["Революцію Гідності","Революцію на граніті","культурну революцію","Помаранчеву революцію"],c:0},
{id:"31-32.41.",q:"«Інформаційно-пропагандистська робота РФ проти України спрямована на проросійськи налаштоване населення… Активною була діяльність Росії в соціальних мережах («Однокласники», «ВКонтакте»)…»\n\nСкладником якого процесу є зазначені факти?",o:["люстрації","формування громадянського суспільства","сепаратистського руху","гібридної війни"],c:3},
{id:"31-32.43.",q:"Урегулювання ситуації на Сході України у зв'язку з російською збройною агресією має відбуватись відповідно до",o:["Будапештського меморандуму","Статуту ООН","Мінських домовленостей","Угоди про асоціацію з Європейським Союзом"],c:2},
{id:"31-32.45.",q:"Укажіть правильне твердження.",o:["Будапештський меморандум ухвалив рішення про без'ядерний статус України відповідно до її Конституції","Україна співпрацює з Євросоюзом в рамках програми «Партнерство заради миру»","військові України брали участь у миротворчих контингентах ООН у Хорватії, Боснії та Герцеговині, Лівані, Афганістані, Сьєрра-Леоне тощо","1991 року Україна вступила до ООН"],c:2},
{id:"31-32.59.",q:"Увідповідніть поняття (1–4) з визначеннями (А–Д).\n\n1 Євромайдан\n2 Небесна Сотня\n3 Помаранчева революція\n4 Революція Гідності\n\nА кампанія протестів у листопаді–грудні 2004 р. у відповідь на фальсифікації результатів президентських виборів\nБ політичні та суспільні зміни в Україні в листопаді 2013 — лютому 2014 року\nВ кампанія ненасильницької громадянської непокори студентів у жовтні 1990 р.\nГ національно-патріотичні протестні акції на підтримку європейського вектора зовнішньої політики, проти корупції та свавілля силовиків\nД загиблі учасники Революції Гідності у грудні 2013 — лютому 2014 року\n\nОберіть відповіді для 1, 2, 3, 4 у цьому порядку.",multi:4,labels:["А","Б","В","Г","Д"],o:["А","Б","В","Г","Д"],c:[3,4,0,1],ordered:true}
];

{h:"Тема 31. Культура 1990-х: позитивні тенденції",l:["«Закон про мови в УРСР» (1989) забезпечив розвиток і функціонування української мови в усіх сферах.","Ліквідовані цензура та ідеологічний тиск; подолано культурну ізоляцію.","Триває відродження історичної пам'яті, повернення забороненої спадщини.","Утворюються благодійні культурні фонди, товариства.","Внесок західної діаспори: меценати Є. Гупуляк, П. Яцик, Ю. Ємець та ін."]},
{h:"Культура: негативні тенденції",l:["Падіння економіки в першій половині 1990-х.","Наслідки тривалої русифікації.","Фінансування культури за залишковим принципом.","Засилля комерційної масової культури."]},
{h:"Освіта і наука",l:["Українізація освітньої системи; гімназії, ліцеї, коледжі, авторські та недержавні школи.","1999 р. — 12-річна освіта (відмовилися 2010 р.) і 12-бальне оцінювання.","1992 р. — відновила діяльність Києво-Могилянська академія.","Участь у космічних програмах «Марс-96», «Шатл-97», «Океан»; 1997 р. — політ Л. Каденюка.","Водночас — комерціалізація й розпродаж майна наукових установ, катастрофічне скорочення фінансування."]},
{h:"Література, мистецтво, спорт",l:["Відмова від соцреалізму; гурт «Бу-Ба-Бу» (Ю. Андрухович, В. Неборак, О. Ірванець); школа постмодерної літератури (О. Забужко, С. Жадан, Ю. Андрухович).","Скорочення книговидавництва й мережі книгарень негативно вплинуло на читання.","Гурти «Океан Ельзи», «Скрябін», «ТНМК»; Руслана — переможниця «Євробачення-2004», Джамала — 2016.","Нові муніципальні театри й студії; нагороди кінофестивалів: «Подорожні» І. Стрембіцького (Канни), «Йшов трамвай дев'ятий номер» С. Коваля (Берлін), «Плем'я» М. Слабошпицького.","1994 р. — перша самостійна участь в Олімпіаді (Ліллегаммер); О. Баюл — перша золота медаль у фігурному катанні.","Олімпійські чемпіони: В. Кличко, Л. Підкопаєва, К. Серебрянська, І. Кравець, Я. Клочкова; чемпіони світу з шахів Р. Пономарьов, Г. Ушеніна."]},
{h:"Тема 32. Зміст програми",p:"Суспільно-політичне життя України в 2005–2013 рр. Авторитарний режим В. Януковича. Революція Гідності. Небесна Сотня. Анексія Криму. Російсько-українська війна. Добровольчі батальйони. Волонтерський рух. Реакція світової спільноти. Спроби мирного врегулювання. Соціально-економічний розвиток до і після 2014 р. Угода про асоціацію з ЄС. Безвізовий режим. Культура і духовність."},
{h:"Що потрібно вміти",l:["<b>Розпізнавати</b> на картосхемі області, АРК, міста Київ і Севастополь.","<b>Характеризувати</b> державотворчі процеси останнього десятиліття, рушійні сили та значення Євромайдану і Революції Гідності, чинники формування громадянського суспільства, важливість асоціації з ЄС і безвізу.","<b>Визначати</b> тенденції суспільно-політичного розвитку та суперечності соціально-економічного розвитку в 2005–2008, 2008–2014 рр. і після 2014 р.","<b>Пояснювати</b> передумови, ознаки та наслідки агресії Росії проти України."]},
{h:"Дати",l:["<b>2008 р.</b> — вступ України до СОТ.","<b>Січень 2010 р.</b> — обрання В. Януковича Президентом.","<b>Листопад 2013 — лютий 2014 р.</b> — Революція Гідності.","<b>2014 р.</b> — підписання Угоди про асоціацію з ЄС.","<b>Червень 2014 р.</b> — обрання П. Порошенка Президентом.","<b>Вересень 2014 р., лютий 2015 р.</b> — Мінські угоди."]},
{h:"Поняття й терміни",l:["<b>Євромайдан</b> — національно-патріотичні протестні акції на підтримку європейського вектора, проти корупції та свавілля силовиків.","<b>Революція Гідності</b> — політичні та суспільні зміни листопада 2013 — лютого 2014 р., спричинені відходом керівництва від курсу на європейську інтеграцію.","<b>Небесна Сотня</b> — загиблі протестувальники Революції Гідності (грудень 2013 — лютий 2014).","<b>Анексія</b> — насильницьке приєднання державою території іншої держави в односторонньому порядку.","<b>Сепаратизм</b> — рух за територіальне відокремлення частини держави з метою створення нового утворення або автономії.","<b>АТО</b> — комплекс спеціальних заходів протидії терористичним діянням.","<b>Тимчасово окупована територія</b> — територія, контрольована РФ внаслідок анексії Криму та війни на сході (АРК, окремі райони Донецької й Луганської областей).","<b>Кіборги</b> — назва захисників Донецького аеропорту.","<b>Волонтерський рух</b> — добровільна неприбуткова суспільно корисна діяльність.","<b>Люстрація</b> — заборона скомпрометованим діячам високого рангу працювати на державній службі.","<b>Громадянське суспільство</b> — сукупність недержавних організацій, що представляють волю та інтереси громадян.","<b>Безвізовий режим</b> — перетин кордонів без попереднього звернення до посольства.","<b>Екуменізм</b> — рух за співпрацю й взаєморозуміння між християнами різних конфесій."]},
{h:"Президентство В. Ющенка (2005–2010): внутрішня політика",l:["Спрощено ведення підприємницької діяльності; боротьба з контрабандою збільшила надходження до бюджету.","Зміни до Конституції обмежили повноваження Президента.","Вибори 2006 р. — за пропорційною системою, «антикризова коаліція»; через суперечності з урядом Януковича Ющенко розпустив Раду; на позачергових виборах перемогла Партія регіонів (34 %).","Не покарано організаторів фальсифікацій виборів 2004 р.","Не обмежено демократію та свободу слова.","Збільшено допомогу при народженні дитини; програма боротьби із сирітством."]},
{h:"Ющенко: відновлення історичної пам'яті",l:["Український інститут національної пам'яті.","2006 р. — Закон «Про Голодомор 1932–1933 років в Україні» (геноцид).","Батурин — заповідник «Гетьманська столиця», палац Розумовського; меморіал героїв Крут; резиденція Хмельницького в Чигирині.","С. Бандері та Р. Шухевичу присвоєно звання Героя України."]},
{h:"Ющенко: зовнішня політика та підсумки",l:["Чітка проєвропейська політика, зближення з НАТО; скасовано обмеження торгівлі США з Україною.","2008 р. — вступ до СОТ.","Заходи не мали народної підтримки; Президент не зумів використати кредит довіри, не налагодив співпраці з урядом і парламентом.","2010 р. — перемога В. Януковича (проросійський курс)."]},
{h:"Газові й торговельні війни з РФ",l:["<b>Мета РФ:</b> закріпити залежність України, придушити євроінтеграцію, примусити вступити до Митного союзу, у перспективі — приєднати до РФ.","<b>Заходи:</b> шантаж і звинувачення у відборі газу (від 2005), «сирна війна» 2012, «шоколадна війна» 2013, експортна блокада 2013.","<b>Наслідки:</b> втрати України ≈ 100 млрд дол.; переорієнтація виробників на ринки Західної Європи; політичної мети Росія не досягла."]},
{h:"Режим В. Януковича (2010–2014): внутрішня політика",l:["Керівні посади — вихідцям з Донбасу за особистою відданістю («сім'я»).","Конституційний Суд визнав неконституційними зміни 2004 р. і відновив Конституцію 1996 р. (розширило повноваження президента).","Ув'язнення Луценка й Тимошенко — вибіркове правосуддя.","Судами Шухевича й Бандеру позбавлено звання Героя України.","Пенсійна реформа для кредиту МВФ; 21 реформа 2011 р. — більшість провалена.","2012 р. — закон «Про засади державної мовної політики» (регіональні мови), скасований у лютому 2014 р."]},
{h:"Янукович: зовнішня політика",l:["Відновлено «багатовекторність»; 2010 р. візит до ЄС (зона вільної торгівлі, безвіз).","<b>Харківські угоди (2010):</b> перебування Чорноморського флоту РФ у Севастополі продовжено до 2042 р. (+5-річні автоматичні періоди) в обмін на знижку на газ.","Зближення з Митним союзом (РФ, Білорусь, Казахстан).","У листопаді 2013 р. відмовився підписати Угоду про асоціацію з ЄС."]},
{h:"Джерело",q:"З Угоди між Україною та РФ (2010): «Сторони подовжують дію Угоди… про статус та умови перебування Чорноморського флоту РФ на території України від 28 травня 1997 року… на двадцять п'ять років з 28 травня 2017 року з наступним автоматичним подовженням на наступні п'ятирічні періоди…»"},
{h:"Революція Гідності: причини та початок",l:["<b>Причини:</b> концентрація влади в руках Януковича й «сім'ї», тотальна корупція, найнижчий серед європейських країн індекс економічної свободи, соціально-економічні проблеми, перетворення України на сателіта РФ.","21 листопада 2013 р. Кабмін призупинив підготовку до підписання Угоди про асоціацію (процес з 2007 р.); на Майдані розпочався Євромайдан.","Ніч з 29 на 30 листопада — розгін, побиття студентів.","1 грудня — Всеукраїнське віче (500 тис.); Штаб національного спротиву (О. Турчинов); вимоги — відставка Кабміну та позачергові вибори."]},
{h:"Революція Гідності: основні події",l:["Влада організувала «антимайдани» й залучала «тітушок».","16 січня 2014 р. — репресивні закони (заборона колон понад 5 авто, наметів, шоломів, допомоги протестувальникам тощо) — поштовх до силового протистояння.","22 січня — загинули Нігоян і Жизневський, знайдено тіло Вербицького — початок Небесної Сотні.","19–21 лютого — штурм Майдану, «антитерористична операція» СБУ; загинуло до 100 осіб.","21 лютого — Рада відновила Конституцію 2004 р.","Ніч проти 22 лютого — Янукович утік до Харкова, потім до Росії; зірвано з'їзд сепаратистів.","22 лютого — Рада 328 голосами усунула Януковича; головою обрано Турчинова; вибори призначено на 25 травня 2014 р."]},
{h:"Результати Революції Гідності",l:["Вищі цінності — права людини й демократія; ціна — Небесна Сотня.","Сформувалося громадянське суспільство, готове брати відповідальність.","Вересень 2014 р. — закон про люстрацію (заборона посад на 10 років для чиновників часів Януковича, посадовців КПРС, працівників КДБ)."]},
{h:"Анексія Криму: причини та перебіг",l:["Порушено Будапештський меморандум (1994) і Договір про дружбу (1997).","<b>Причини:</b> не допустити виходу України з-під впливу після перемоги Революції; загальмувати євроінтеграцію й вступ до НАТО; доступ до родовищ нафти й газу; амбіції Путіна як «збирача земель».","1 березня 2014 р. — дозвіл Держдуми на введення військ; захоплення військових об'єктів, блокування частин.","Верховна Рада АРК ухвалила Декларацію незалежності АРК і Севастополя.","16 березня 2014 р. — незаконний референдум (≈ 97 % «за»), на його основі Росія включила Крим до складу."]},
{h:"Джерело",q:"Із заяви В. Януковича (1.03.2014): «Як законно обраний Президент України заявляю: події на Майдані, незаконне захоплення влади в Києві призвели до того, що Україна опинилася на порозі громадянської війни… звертаюся до Президента Росії В. В. Путіна з проханням використовувати збройні сили Російської Федерації для відновлення законності, миру, правопорядку, стабільності, захисту населення України»."},
{h:"Політика РФ у Криму; позиція України та світу",l:["Цензура, обмеження свободи слова, залякування й вбивства інакодумців; Крим перетворюється на військову базу.","Меджліс не визнав окупації; Джемілєву й Чубарову заборонено в'їзд.","Україна вважає Крим тимчасово окупованим, втрати — 1 трлн грн.","Міжнародні організації визнали дії РФ неспровокованою агресією; санкції ЄС, США та інших країн.","Позови України до Гаазького суду й ЄСПЛ; триває торгова й енергетична блокада Криму."]},
{h:"Вибори Президента 2014 р. і П. Порошенко",l:["25 травня 2014 р. — позачергові вибори; жителі Криму й Севастополя голосували в інших регіонах; на Донбасі понад половина дільниць не працювала.","Зареєструвався 21 кандидат; П. Порошенко набрав 54,7 % і переміг у першому турі.","<b>П. Порошенко</b> (нар. 1965) — п'ятий Президент України; закінчив Київський університет (міжнародні економічні відносини), нардеп з 1998 р.; секретар РНБО, голова Ради НБУ, міністр закордонних справ, міністр економічного розвитку й торгівлі; власник «Roshen» і «5-го каналу»."]},
{h:"Порошенко: внутрішня політика",l:["Закон про люстрацію; електронне декларування; суспільне мовлення.","НАБУ та інші антикорупційні органи.","Повернено контроль над Укрнафтою; націоналізовано ПриватБанк і «Укртелеком».","Децентралізація — найуспішніша реформа (2017 р.: дотаційних бюджетів на 24 % менше, донорів на 12,5 % більше).","Воєнна доктрина визнає Росію головним противником і курс на євроатлантичну інтеграцію; програма розвитку ЗСУ за стандартами НАТО; вітання «Слава Україні!» — «Героям слава!»; зарплати військових підвищено втричі.","Чотири «декомунізаційні» закони."]},
{h:"Порошенко: реформи та зовнішня політика",l:["Створено Православну церкву України; Томос про автокефалію — січень 2019 р.","Судова реформа: конкурсний добір, переатестація суддів, дисциплінарна відповідальність.","Мінімальну зарплату підвищено вдвічі; освітня реформа (12-річна освіта).","Закон «Про забезпечення функціонування української мови як державної».","Зовнішня політика: збереження незалежності й територіальної цілісності, співпраця з НАТО, ЄС, США; газова незалежність від РФ; міжнародна підтримка (дипломатична, гуманітарна, військова, санкції)."]},
{h:"Російсько-українська війна: початок АТО та передумови",l:["Квітень–травень 2014 р. — незаконні збройні формування, сили ФСБ і ГРУ захопили органи влади й об'єкти в Донецькій і Луганській областях.","Україна розпочала АТО із залученням ЗСУ (з 2018 р. — Операція об'єднаних сил, ООС).","Росія не визнала вторгнення; конфлікт названо гібридною війною.","<b>Передумови:</b> антиукраїнська інформаційна політика РФ з 2000-х, підтримка сепаратистів проросійськими політиками, прагнення відновити СРСР під гаслом «руського міра».","7–27 квітня 2014 р. — проголошені «ДНР» і «ЛНР», визнані Україною терористичними організаціями."]},
{h:"Добровольчі батальйони",l:["Добробати — добровольчі формування для захисту територіальної цілісності.","Перший — батальйон Кульчицького (березень 2014).","Відомі: «Дніпро-1», «Айдар», «Правий сектор», «Азов».","Нині інтегровані в ЗСУ й Нацгвардію (Конституція забороняє формування, не передбачені законом)."]},
{h:"Перебіг бойових дій 2014 р.",l:["1 липня 2014 р. — контрнаступ; звільнено Слов'янськ, Краматорськ, Лисичанськ.","Липень 2014 р. — збито «Боїнг-777» (рейс Амстердам — Куала-Лумпур), 298 загиблих; ракета ЗРК «Бук» РФ; третя хвиля санкцій.","«Гуманітарні конвої» РФ — допомога терористам.","24–30 серпня 2014 р. — Іловайськ: близько 600 українських воїнів оточено, 186 загинули."]},
{h:"Мінські угоди",l:["<b>Мінськ-1 (вересень 2014):</b> тристоронній формат (Україна, РФ, ОБСЄ); припинення воєнних дій, виведення іноземних військ; виконання зірвано.","<b>Мінськ-2 (лютий 2015):</b> «нормандська четвірка» (Німеччина, Франція, Україна, РФ); припинення вогню, відведення важкої артилерії, відновлення контролю над кордоном до кінця 2015 р., виведення іноземних формувань; крім часткового відведення техніки, РФ не виконала.","12–17 лютого 2015 р. — РФ захопила Дебальцеве попри переговори.","Україна наполягає: припинення вогню, виведення військ, доступ ОБСЄ, звільнення заручників мають передувати політичній частині."]},
{h:"Джерело",q:"Із Декларації на підтримку «Комплексу заходів з виконання Мінських угод» (2015): «Негайне і всеосяжне припинення вогню в окремих районах Донецької та Луганської областей і його суворе виконання, починаючи з 00 год 00 хв (київський час) 15 лютого 2015 року. Відведення всього важкого озброєння обома сторонами на рівні відстані з метою створення зони безпеки шириною мінімум 50 км…»"},
{h:"Оборона Донецького аеропорту (ДАП)",l:["Тривала 242 дні (травень 2014 — січень 2015); учасників назвали «кіборгами».","20 січня 2015 р. бойовики підірвали новий термінал; «Кіборги вистояли — не встояв бетон»; 22 січня ЗСУ залишили позиції.","Значення: логістика ЗСУ, відволікання сил противника, велике моральне значення."]},
{h:"Ситуація на окупованих територіях і втрати",l:["Законодавство України не діє; випадки викрадень, катувань, позасудових страт.","З 1 грудня 2014 р. припинено виплату пенсій; підприємства закриті, обладнання вивозиться до РФ.","Станом на 2020 р. (ООН): 41–44 тис. жертв, понад 13 тис. загиблих (≈ 4100 військових); понад 1,5 млн внутрішньо переміщених осіб; ≈ 300 полонених."]},
{h:"Волонтерський рух",l:["Розгорнувся стихійно на початку війни для допомоги армії.","Згодом — допомога переселенцям, родинам учасників АТО й загиблих.","Збір пожертв, виготовлення спорядження, доставка допомоги, пошук зниклих; «волонтерські десанти» у Міноборони."]},
{h:"Економіка 2012–2013 рр. і гальмівні чинники",l:["Стагнація: нульове зростання ВВП, штучне утримання курсу гривні за рахунок резервів НБУ, корупція, відтік західних компаній, дефіцит бюджету, залежність від імпорту газу.","<b>Гальмують розвиток:</b> анексія Криму, війна й видатки на оборону та біженців, втрата російського ринку й дорожчий газ, девальвація гривні, втрата підприємств у зоні війни.","ВВП: 2014 р. — −6,6 %, 2015 р. — −9,8 %."]},
{h:"Чинники економічного зростання. 2014–2018 рр.",l:["Угода про асоціацію: скасовано майже 95 % мит на промислову та понад 80 % на аграрну продукцію; експорт до ЄС перевищив втрати на російському напрямку; допомога ЄС, США, міжнародних інституцій.","З 2016 р. — зростання ВВП, промвиробництва, реальних зарплат; зросла частка «зеленої» енергетики; банківський сектор прибутковий з 2018 р.","Мігранти перерахували 2018 р. 14,5 млрд дол.","Легкість ведення бізнесу: 112-те (2013) → 71-ше місце; головний партнер — ЄС (40 %).","Антикорупційні органи: НАБУ, САП, НАЗК, антикорупційний суд, ProZorro; індекс сприйняття корупції: 144-те (2013) → 120-те (2018).","Оборона > 5 % ВВП; ЗСУ з 168 до 255 тис.; довіра до армії 21 % → 61 % (2013–2019)."]},
{h:"Євроінтеграція: Угода про асоціацію",l:["21 березня 2014 р. — підписано політичну частину, 27 червня 2014 р. — економічну.","Передбачає реформу судової системи, боротьбу з корупцією, європейські стандарти якості, безмитну торгівлю, вихід виробників на ринки ЄС, співпрацю вишів."]},
{h:"Безвізовий режим з ЄС",l:["Травень 2017 р.; біометричні паспорти; до 90 днів протягом 180.","Потрібні підтвердження мети поїздки, проживання, коштів, наміру повернутися, медстраховка.","Візи скасовано до всіх держав ЄС, окрім Ірландії та Великої Британії.","Стимул для перевезень, туризму, бізнесу, наукових і культурних контактів; до січня 2019 р. — 2 млн українців."]},
{h:"Мовна політика",l:["<b>2012 р.</b> (Янукович): закон «Про засади державної мовної політики» — регіональна мова при понад 10 % носіїв; фактично нова хвиля русифікації; втратив чинність у лютому 2014 р.","<b>2019 р.:</b> закон «Про забезпечення функціонування української мови як державної» — єдина державна, місцевій владі заборонено втручатися; квоти для українського контенту ≥ 75 %; не поширюється на приватне спілкування й релігію."]},
{h:"Освітні реформи та історична пам'ять",l:["За Ющенка: обов'язкове ЗНО, Болонський процес.","2018 р. — перехід до Нової української школи (НУШ), 12 років навчання.","Історична пам'ять за Ющенка: закон про Голодомор, Герої України Бандера й Шухевич (за Януковича скасовано), Батурин, Чигирин, Крути."]},
{h:"Декомунізація",l:["Розпочалася з проголошення незалежності: скасовано вивчення комуністичної ідеології, перейменування установ і топонімів.","За Ющенка — демонтаж пам'ятників причетним до голодоморів і репресій; призупинено за Януковича.","2015 р. — пакет законів про декомунізацію: усунення символіки й назв комуністичного режиму та діяльності КПУ."]},
{h:"Релігія і церква",l:["15 грудня 2018 р. — об'єднавчий собор УПЦ КП і УАПЦ під наглядом представників Вселенського патріарха; створено ПЦУ, митрополитом Київським обрано Єпіфанія.","6 січня 2019 р. — Томос про автокефалію (указ предстоятеля помісної церкви, що проголошує автономію в управлінні)."]}
];

{w:"На плакаті — цифра 21 і монумент Незалежності. <b>21 листопада 2013 р.</b> Кабмін призупинив підготовку до підписання Угоди про асоціацію, і на Майдані розпочався Євромайдан.",r:"Революція Гідності: причини та початок"},
{w:"Янукович утік 22 лютого 2014 р., а вже в лютому–березні Росія анексувала Крим і розпочала війну на Донбасі. Саме це учасник Євромайдану називає початком нових випробувань.",r:"Анексія Криму: причини та перебіг"},
{w:"Слова про «кіборгів» належать до оборони <b>Донецького аеропорту</b>, яка тривала 242 дні, до січня 2015 р.",r:"Оборона Донецького аеропорту (ДАП)"},
{w:"Йдеться про вихід українських військ із Дебальцевого в лютому 2015 р. Колони розстріляли, а залізничний вузол захопила Росія: наслідком стала <b>втрата Дебальцевого</b>.",r:"Мінські угоди"},
{w:"Постанова, яка визнає РФ державою-агресором, а «ДНР» і «ЛНР» — терористичними організаціями, — акт <b>Верховної Ради України</b> (2015 р.). Такі заклики до міжнародних партнерів — функція парламенту.",r:"Російсько-українська війна: початок АТО та передумови"},
{w:"На плакаті — тарілка з контуром України, яку «ріжуть» виделкою й ножем. Це символ насильницького приєднання території, тобто <b>анексії</b>.",r:"Анексія Криму: причини та перебіг"},
{w:"У березні 2014 р. про «возз'єднання» з Росією заявила <b>Автономна Республіка Крим</b> (разом із Севастополем) після незаконного референдуму 16 березня.",r:"Анексія Криму: причини та перебіг"},
{w:"2014–2015 рр. — час анексії Криму, початку АТО та появи тимчасово окупованих територій. Інші набори термінів належать до 1990-х, 2004–2008 рр. чи економічних явищ.",r:"Поняття й терміни"},
{w:"Плакат із написом «КІБОРГИ» присвячений захисникам <b>Донецького аеропорту</b> (травень 2014 — січень 2015 р.).",r:"Оборона Донецького аеропорту (ДАП)"},
{w:"Протест проти того, що влада не підписала Угоду про асоціацію з ЄС, — це <b>Революція Гідності</b> (2013–2014 рр.). Революція на граніті відбулася 1990 р., Помаранчева — 2004 р.",r:"Революція Гідності: причини та початок"},
{w:"Інформаційно-пропагандистська робота РФ проти України, зокрема в соцмережах, — складник <b>гібридної війни</b>, поряд зі збройним вторгненням.",r:"Російсько-українська війна: початок АТО та передумови"},
{w:"Україна наполягає, що врегулювання на Сході має відбуватися за <b>Мінськими домовленостями</b>: припинення вогню, відведення озброєнь, виведення іноземних формувань, потім політична частина.",r:"Мінські угоди"},

{w:"Відповідність: <b>1 Євромайдан — Г</b> (протестні акції за європейський курс); <b>2 Небесна Сотня — Д</b> (загиблі учасники революції); <b>3 Помаранчева революція — А</b> (протести 2004 р. проти фальсифікацій); <b>4 Революція Гідності — Б</b> (зміни листопада 2013 — лютого 2014 р.). Варіант В описує Революцію на граніті.",r:"Поняття й терміни"}
];
tasks.forEach((t,i)=>{t.explain=EXPLAIN[i]});
function showTheoryAt(h){showTheory();const i=theory.findIndex(b=>b.h===h),bl=document.querySelectorAll(".tb");if(i>=0&&bl[i])bl[i].scrollIntoView({behavior:"smooth",block:"start"})}
const $=id=>document.getElementById(id),TOTAL=tasks.length,KEY="hist31-32-progress";
let current=0,inTheory=false;const state=tasks.map(()=>({picked:[]}));
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.state&&s.state.length===TOTAL){s.state.forEach((x,i)=>{if(Array.isArray(x.picked))state[i].picked=x.picked});current=Math.min(s.current||0,TOTAL-1)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({state,current}))}catch(e){}};
const cs=t=>Array.isArray(t.c)?t.c:[t.c],need=t=>t.multi||1,labs=t=>t.labels||LETTERS;
const isDone=i=>{const t=tasks[i],p=state[i].picked;return t.ordered?p.length===4&&!p.includes(-1):p.length===need(t)};
const isRight=i=>{const t=tasks[i],p=state[i].picked,c=cs(t);return t.ordered?p.length===c.length&&c.every((x,k)=>p[k]===x):p.length===c.length&&c.every(x=>p.includes(x))};
function buildNums(){const b=$("nums");b.innerHTML="";const t=document.createElement("button");t.className="num";t.id="tBtn";t.textContent="Т";t.onclick=showTheory;b.appendChild(t);
tasks.forEach((_,i)=>{const n=document.createElement("button");n.className="num";n.dataset.i=i;n.textContent=i+1;n.onclick=()=>go(i);b.appendChild(n)})}
function paint(){[...$("nums").children].forEach(b=>{if(b.id==="tBtn"){b.className="num"+(inTheory?" current":"");return}
const i=+b.dataset.i;b.className="num";if(state[i].picked.some(x=>x>=0))b.classList.add(isDone(i)?(isRight(i)?"correct":"wrong"):"answered");if(!inTheory&&i===current)b.classList.add("current")})}
function buildTheory(){const v=$("theoryView");v.innerHTML='<h2 class="t-title">Теорія</h2>';
theory.forEach(x=>{const d=document.createElement("div");d.className="tb";let h="<h3>"+x.h+"</h3>";
if(x.p)h+="<p>"+x.p+"</p>";if(x.q)h+="<blockquote>"+x.q+"</blockquote>";
if(x.l)h+="<ul>"+x.l.map(i=>"<li>"+i+"</li>").join("")+"</ul>";d.innerHTML=h;v.appendChild(d)})}
function updateToTop(){$("toTop").classList.toggle("show",inTheory&&window.scrollY>200)}
function showTheory(){inTheory=true;$("testView").classList.add("hidden");$("theoryView").classList.remove("hidden");$("counter").textContent="Теорія";paint();scrollTo(0,0);updateToTop()}
function render(){inTheory=false;updateToTop();$("theoryView").classList.add("hidden");$("testView").classList.remove("hidden");
const t=tasks[current],s=state[current],L=labs(t),done=isDone(current);
$("counter").textContent="Завдання "+(current+1)+" з "+TOTAL;
const q=$("question");q.textContent="";const b=document.createElement("b");b.textContent=t.id+" ";q.append(b,t.q);
if(t.note){const em=document.createElement("em");em.textContent=t.note;q.appendChild(em)}
$("lbl").textContent=t.multi?"Позначте відповіді (потрібно обрати "+t.multi+"):":"Позначте відповіді:";
const ul=$("options");ul.innerHTML="";
if(!t.ordered)t.o.forEach((text,i)=>{const li=document.createElement("li");let c="option"+(s.picked.includes(i)?" selected":"");
if(done){if(cs(t).includes(i))c+=" right";else if(s.picked.includes(i))c+=" wrong";c+=" locked"}
li.className=c;li.tabIndex=0;li.innerHTML='<span class="letter"></span><span class="txt"></span>';
li.firstChild.textContent=/right/.test(c)?"✓":/wrong/.test(c)?"✕":L[i];li.lastChild.textContent=text;
li.onclick=()=>pick(i);li.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(i)}};ul.appendChild(li)});
const g=$("grid");g.innerHTML="";
if(t.ordered){["1","2","3","4"].forEach((n,k)=>{const col=document.createElement("div");col.className="col";const bb=document.createElement("b");bb.textContent=n;col.appendChild(bb);
const row=document.createElement("div");row.style.cssText="display:flex;flex-direction:column;gap:4px";
L.forEach((l,i)=>{const bx=document.createElement("button");const on=s.picked[k]===i;let c="box"+(on?" on":"");if(done){if(cs(t)[k]===i)c="box right";else if(on)c="box wrong"}
bx.className=c;bx.textContent=l;bx.onclick=()=>pickOrd(k,i);row.appendChild(bx)});col.appendChild(row);g.appendChild(col)})}
else L.forEach((l,i)=>{const on=s.picked.includes(i),col=document.createElement("div");col.className="col";const bb=document.createElement("b");bb.textContent=l;
const bx=document.createElement("button");let c="box"+(on?" on":"");if(done){if(cs(t).includes(i))c="box right";else if(on)c="box wrong"}
bx.className=c;bx.textContent=c==="box wrong"?"✕":(on||c==="box right")?"✓":"";bx.onclick=()=>pick(i);col.append(bb,bx);g.appendChild(col)});
const ex=$("explain");if(done){const ok=isRight(current);ex.className="explain "+(ok?"":"bad");
const ans=t.ordered?cs(t).map((x,k)=>(k+1)+"–"+L[x]).join(", "):cs(t).map(i=>L[i]).join(", ");
ex.innerHTML='<div>Правильна відповідь: <b>'+ans+'</b>. Бали: '+(ok?1:0)+' з 1. Після показу відповіді змінити її вже не можна.</div>'+(t.explain?'<h4>Чому так</h4><p class="why">'+t.explain.w+'</p>'+(t.explain.r?'<p class="rep">Повторити: <a href="#" id="repLink"></a></p>':''):'');
if(t.explain&&t.explain.r){const a=$("repLink");a.textContent=t.explain.r;a.onclick=e=>{e.preventDefault();showTheoryAt(t.explain.r)}}}else{ex.className="explain hidden"}
paint();save()}
function pick(i){const t=tasks[current],s=state[current];if(isDone(current))return;const k=s.picked.indexOf(i);
if(k>=0)s.picked.splice(k,1);else if(t.multi){if(s.picked.length<t.multi)s.picked.push(i)}else s.picked=[i];render()}
function pickOrd(k,i){const s=state[current];if(isDone(current))return;const a=[0,1,2,3].map(x=>s.picked[x]===undefined?-1:s.picked[x]);a[k]=i;s.picked=a;render()}
function go(i){current=Math.max(0,Math.min(TOTAL-1,i));render();scrollTo(0,0)}
$("skip").onclick=()=>go(current+1>=TOTAL?0:current+1);
document.addEventListener("keydown",e=>{if(inTheory)return;if(e.key==="ArrowRight")go(current+1);if(e.key==="ArrowLeft")go(current-1)});
$("toTop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.addEventListener("scroll",updateToTop,{passive:true});
$("total").textContent=TOTAL;buildNums();buildTheory();render();showTheory();
</script></body></html>
