      "Гуни — тюрко-монгольське об'єднання племен, що вирушило зі степів на захід під тиском Китаю. У 370–376 рр. гуни розбили остготів і тривалий час панували в причорноморських степах від Азовського моря до Дунаю, здійснюючи набіги на Західну Європу. Занепад гунської держави пов'язаний зі смертю в 453 р. Аттіли. Гуни зруйнували всі міста-держави, окрім Херсонеса і Пантікапея. Вони вдосконалили сідло, використовували великий асиметричний лук.",
      "Наслідки: падіння Західної Римської імперії (476 р.); формування так званих варварських королівств на її території; продовженням Великого переселення народів є Велике розселення слов'ян."
    ]
  },
  {
    "h": "Давні слов’яни",
    "list": [
      "Більшість вчених вважає, що прабатьківщина слов'ян — територія, обмежена на заході Віслою та Карпатами, на півночі — Прип'яттю, на сході — Середнім Дніпром, на півдні — середніми течіями Дністра та Південного Бугу.",
      "Античні джерела I–II ст. (Пліній Старший, Тацит) згадують слов'ян як венедів. У VI ст. готський історик Йордан згадує про антів, що жили в Подніпров'ї та Приазов'ї; склавини — західні слов'яни. Назва «слов'яни» вперше звучить також у VI ст.",
      "Імовірно, розкол слов'янської спільноти відбувся в IV ст. під час Великого переселення народів, коли територією України переміщувалися «варварські» племена.",
      "Велике розселення слов'ян (II–VII ст.) на території від Балканського півострова до Балтики, від Ельби до Подніпров'я. Причини: розвиток господарства і торговельних зв'язків, демографічний вибух, вплив сусідніх народів (готів, гунів, аварів). Наслідок: сформувалися південні, західні та східні слов'яни. До останньої групи належать українці.",
      "Господарство слов'ян: використовували двопільну систему землеробства (змінне почергове використання двох полів), домашнє скотарство. Промисли: полювання, рибальство, бортництво. Ремесла: металургія, ковальство, зброярство, гончарство, ювелірна справа. Торгівля з населенням Подунав'я, Прибалтики, Північного Причорномор'я.",
      "Релігія: язичництво. Дажбог — бог Сонця, Стрибог — бог вітру, Перун — бог грому і блискавки, Велес — бог худоби та багатства, Мокош — богиня родючої землі. На святилищах-капищах волхви (жерці) проводили обряди та приносили жертви богам. Померлих слов'яни спалювали і ховали прах під курганами."
    ]
  }
];
const INSTANT_FEEDBACK = true;
const TOTAL = tasks.length;
const TOPIC_ID = 2;
const LS_KEY = "hist" + TOPIC_ID + "-progress";
const summaryKey = n => "progress-topic-" + n;
let current = 0;
let inTheory = false;
const state = tasks.map(() => ({ picked: [] }));
const $ = id => document.getElementById(id);
const labelsOf = t => t.labels || LETTERS;
const correctSet = t => Array.isArray(t.correct) ? t.correct : [t.correct];
function isDone(i) {
  const t = tasks[i], p = state[i].picked;
  if (t.matrix) return p.length === t.cols.length && Array.from(p).every(x => Number.isInteger(x) && x >= 0 && x < t.options.length);
  return p.length === (t.multi || 1);
}
function isRight(i) {
  const t = tasks[i], p = state[i].picked, c = correctSet(t);
  if (t.ordered || t.matrix) return p.length === c.length && c.every((x, k) => p[k] === x);
  return p.length === c.length && c.every(x => p.includes(x));
}
try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if (saved && Array.isArray(saved.state) && saved.state.length === TOTAL) {
    saved.state.forEach((s, i) => {
      if (s && Array.isArray(s.picked) && s.picked.length <= (tasks[i].matrix ? tasks[i].cols.length : (tasks[i].multi || 1))) {
        state[i].picked = s.picked.map(x => Number.isInteger(x) && x >= 0 && x < tasks[i].options.length ? x : null);
      }
    });
    current = Number.isInteger(saved.current) ? Math.max(0, Math.min(saved.current, TOTAL - 1)) : 0;
  }
} catch (e) {}
function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ state, current }));
    const answered = state.filter((_, i) => isDone(i)).length;
    localStorage.setItem(summaryKey(TOPIC_ID), JSON.stringify({ answered, total: TOTAL }));
  } catch (e) {}
}
function buildNums() {
  const box = $("nums"); box.innerHTML = "";
  const t = document.createElement("button");
  t.className = "num theory-btn"; t.id = "tBtn"; t.textContent = "Т";
  t.setAttribute("aria-label", "Теорія"); t.onclick = showTheory; box.appendChild(t);
  tasks.forEach((_, i) => {
    const b = document.createElement("button"); b.className = "num";
    b.dataset.i = i; b.textContent = i + 1; b.setAttribute("aria-label", "Завдання " + (i + 1));
    b.onclick = () => go(i); box.appendChild(b);
  });
}
function paintNums() {
  [...$("nums").children].forEach(b => {
    if (b.id === "tBtn") { b.className = "num theory-btn" + (inTheory ? " current" : ""); return; }
    const i = +b.dataset.i; b.className = "num";
    if (state[i].picked.length) {
      if (INSTANT_FEEDBACK && isDone(i)) b.classList.add(isRight(i) ? "correct" : "wrong");
      else b.classList.add("answered");
    }
    if (!inTheory && i === current) b.classList.add("current");
  });
}
function buildTheory() {
  const v = $("theoryView"); v.innerHTML = '<h2 class="theory-title">Теорія до теми 2</h2>';
  theory.forEach(item => {
    const d = document.createElement("div"); d.className = "theory-block";
    const h = document.createElement("h3"); h.textContent = item.h; d.appendChild(h);
    if (item.p) { const p = document.createElement("p"); p.innerHTML = item.p; d.appendChild(p); }
    if (item.quote) { const q = document.createElement("blockquote"); q.textContent = item.quote; d.appendChild(q); }
    if (item.list) {
      const ul = document.createElement("ul");
      item.list.forEach(x => { const li = document.createElement("li"); li.innerHTML = x; ul.appendChild(li); }); d.appendChild(ul);
    }
    if (item.after) { const p = document.createElement("p"); p.className = "after"; p.innerHTML = item.after; d.appendChild(p); }
    v.appendChild(d);
  });
  const end = document.createElement("div"); end.className = "theory-end"; v.appendChild(end);
}
function updateToTop() { $("toTop").classList.toggle("show", inTheory && window.scrollY > 200); }
function showTheory() {
  inTheory = true; $("testView").classList.add("hidden"); $("theoryView").classList.remove("hidden");
  $("counter").textContent = "Теорія"; paintNums(); window.scrollTo({ top: 0 }); updateToTop();
}
function showTheoryAt(heading) {
  showTheory(); const idx = theory.findIndex(b => b.h === heading);
  const blocks = document.querySelectorAll(".theory-block");
  if (idx >= 0 && blocks[idx]) blocks[idx].scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderExplain(t) {
  const box = $("explain");
  if (!(INSTANT_FEEDBACK && isDone(current) && t.explain)) { box.className = "explain hidden"; box.innerHTML = ""; return; }
  const right = isRight(current);
  const ans = t.answerText || correctSet(t).map(i => labelsOf(t)[i]).join(t.ordered ? " → " : ", ");
  box.className = "explain " + (right ? "good" : "bad");
  box.innerHTML = '<div class="score">Правильна відповідь: <b>' + ans + '</b>. Бали: ' + (right ? 1 : 0) +
    ' з 1. Після показу відповіді змінити її вже не можна.</div>' +
    '<h4>Чому так</h4><p class="why">' + t.explain.why + '</p>' +
    '<p class="repeat">Повторити: <a href="#" id="repeatLink"></a></p>';
  const a = $("repeatLink"); a.textContent = t.explain.repeat;
  a.onclick = e => { e.preventDefault(); showTheoryAt(t.explain.repeat); };
}
function render() {
  inTheory = false; updateToTop(); $("theoryView").classList.add("hidden"); $("testView").classList.remove("hidden");
  const t = tasks[current], s = state[current], labels = labelsOf(t), c = correctSet(t);
  const done = INSTANT_FEEDBACK && isDone(current);
  $("counter").textContent = "Завдання " + (current + 1) + " з " + TOTAL;
  const q = $("question"); q.textContent = "";
  const idEl = document.createElement("b"); idEl.textContent = t.id + " "; q.appendChild(idEl);
  q.appendChild(document.createTextNode(t.q));
  if (t.note) { const em = document.createElement("em"); em.textContent = t.note; q.appendChild(em); }
  $("answersLabel").textContent = t.hint || (t.multi ? "Позначте відповіді (потрібно обрати " + t.multi + "):" : "Позначте відповідь:");
  const ul = $("options"); ul.innerHTML = "";
  t.options.forEach((text, i) => {
    const li = document.createElement("li");
    const pos = t.ordered ? s.picked.indexOf(i) : -1;
    let cls = t.matrix ? "option locked" : "option" + (s.picked.includes(i) ? " selected" : "");
    if (done && !t.matrix) {
      if (t.ordered) { if (pos >= 0) cls += c[pos] === i ? " right" : " wrong"; }
      else { if (c.includes(i)) cls += " right"; else if (s.picked.includes(i)) cls += " wrong"; }
      cls += " locked";
    }
    li.className = cls; li.tabIndex = t.matrix ? -1 : 0;
    li.innerHTML = '<span class="letter"></span><span class="txt"></span>';
    li.querySelector(".letter").textContent = /\bright\b/.test(cls) ? "✓" : /\bwrong\b/.test(cls) ? "✕" : labels[i];
    li.querySelector(".txt").textContent = (pos >= 0 ? "[" + (pos + 1) + "] " : "") + text;
    if (!t.matrix) {
      li.onclick = () => pick(i);
      li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(i); } };
    }
    ul.appendChild(li);
  });
  const grid = $("answerGrid"); grid.innerHTML = ""; grid.className = "answer-grid" + (t.matrix ? " matrix" : "");
  if (!t.matrix) labels.forEach((L, i) => {
    const on = s.picked.includes(i), pos = s.picked.indexOf(i);
    const col = document.createElement("div"); col.className = "answer-col";
    const b = document.createElement("b"); b.textContent = L; col.appendChild(b);
    const bx = document.createElement("button"); bx.type = "button";
    let bc = "box" + (on ? " on" : ""), mark = on ? (t.ordered ? String(pos + 1) : "✓") : "";
    if (done) {
      const ok = t.ordered ? on && c[pos] === i : c.includes(i);
      const bad = on && !ok;
      if (ok) { bc = "box right"; mark = "✓"; } else if (bad) { bc = "box wrong"; mark = "✕"; }
      bc += " locked";
    }
    bx.className = bc; bx.textContent = mark; bx.setAttribute("aria-label", "Відповідь " + L);
    bx.setAttribute("aria-pressed", String(on)); bx.setAttribute("aria-disabled", String(done));
    bx.onclick = () => pick(i); col.appendChild(bx); grid.appendChild(col);
  });
  if (t.matrix) t.cols.forEach((cl, ci) => {
    const col = document.createElement("div"); col.className = "answer-col";
    const b = document.createElement("b"); b.textContent = cl; col.appendChild(b);
    labels.forEach((L, ri) => {
      const on = s.picked[ci] === ri;
      let bc = "box" + (on ? " on" : ""), mark = L;
      if (done) {
        if (ri === c[ci]) { bc = "box right"; mark = "✓"; } else if (on) { bc = "box wrong"; mark = "✕"; }
        bc += " locked";
      }
      const bx = document.createElement("button"); bx.type = "button"; bx.className = bc; bx.textContent = mark;
      bx.setAttribute("aria-label", "Для " + cl + " — " + L); bx.setAttribute("aria-pressed", String(on)); bx.setAttribute("aria-disabled", String(done));
      bx.onclick = () => pickCell(ci, ri); col.appendChild(bx);
    });
    grid.appendChild(col);
  });
  renderExplain(t); paintNums(); save();
}
function pick(i) {
  const t = tasks[current], s = state[current];
  if (t.matrix || (INSTANT_FEEDBACK && isDone(current))) return;
  const k = s.picked.indexOf(i);
  if (k >= 0) s.picked.splice(k, 1);
  else if (t.multi) { if (s.picked.length < t.multi) s.picked.push(i); }
  else s.picked = [i];
  render();
}
function pickCell(ci, ri) {
  const s = state[current]; if (INSTANT_FEEDBACK && isDone(current)) return;
  const p = s.picked;
  if (p[ci] === ri) p[ci] = null;
  else { while (p.length <= ci) p.push(null); p[ci] = ri; }
  while (p.length && (p[p.length - 1] === null || p[p.length - 1] === undefined)) p.pop();
  render();
}
function go(i) { current = Math.max(0, Math.min(TOTAL - 1, i)); render(); window.scrollTo({ top: 0 }); }
$("skip").onclick = () => go(current + 1 >= TOTAL ? 0 : current + 1);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (inTheory || $("drawer").classList.contains("open")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); }
});
$("toTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
window.addEventListener("scroll", updateToTop, { passive: true });
$("total").textContent = TOTAL;
buildNums(); buildTheory(); render(); showTheory();

</script>
