      "Зачинатель нової української літератури, автор перших творів, написаних українською народною мовою: поеми «Енеїда» (1798), п&#x27;єс «Наталка Полтавка», «Москаль-чарівник» (1819). Народився в сім&#x27;ї дрібного полтавського дворянина; служив чиновником у різних полтавських канцеляріях, пізніше був домашнім учителем. Тоді й розпочав роботу над «Енеїдою». З 27-річного віку перебував на військовій службі, брав участь у російсько-турецькій війні. Під час наполеонівських воєн Котляревський формував 5-й козачий полк. 1816 р. його призначили директором Полтавського театру, для якого він написав п&#x27;єси. Котляревський допоміг викупити з кріпацтва геніального актора М. Щепкіна. У 60-річному віці Котляревський через хворобу пішов у відставку, відпустивши на волю дві сім&#x27;ї своїх кріпаків. У його похороні брала участь чи не вся Полтава."

      "Народився на Чернігівщині в сім&#x27;ї досить заможного землевласника. Був вільним слухачем у Київському університеті, хоча диплома не отримав. Працюючи вчителем у Києві, зійшовся з М. Гулаком, М. Костомаровим і В. Білозерським, які стали засновниками братства. Тоді ж він серйозно захопився християнськими ідеями. Завдяки своїй літературній діяльності Куліш отримав запрошення до Петербурзького університету на посаду викладача російської мови для іноземних студентів. Під час відрядження до Польщі його заарештували у справі Кирило-Мефодіївського братства. Далі було заслання до В&#x27;ятки, та вже за три роки Куліш повернувся до російської столиці. 1859 р. він видав перший історичний роман українською мовою «Чорна рада» та став співзасновником громади. Згодом тісно співпрацював з галицьким українським рухом народовців. Протягом життя змінювалися погляди митця: у молодості захоплювався добою Козаччини, у зрілі роки розчарувався в ній, вважаючи надто руйнівною стихією. Він набагато пережив своїх товаришів по братству. Помер Пантелеймон Куліш майже там, де й народився, — на Чернігівщині."

      "Народився у с. Моринці на Черкащині в родині кріпака. Був викуплений із кріпацтва за гроші, виручені від продажу портрета В. Жуковського пензля К. Брюллова. Закінчив Петербурзьку Академію мистецтв. Під впливом Є. Гребінки почав писати вірші, перша збірка яких з&#x27;явилася в 1840 р. під назвою «Кобзар». 1843 р. Шевченко повернувся в Україну, де став членом Кирило-Мефодіївського братства. Покаранням за просвітницьку діяльність стали десять років солдатчини в Оренбурзькому краї. Поезія Шевченка, написана живою розмовною мовою, за словами історика Я. Грицака, «будила національне почуття і давала бачення майбутнього: якщо в минулому Україна користувалася правами самостійної держави, то це мало служити достатніми підставами для здобуття політичної незалежності у майбутньому». Увесь пізніший український національний рух ототожнював себе з Шевченком як духовним батьком, а мученицька доля стала основою національного міфу. Помер поет 10 березня 1861 р. в Петербурзі, був перепохований у Каневі на Чернечій (нині Тарасовій) горі."

const grid=$('answerGrid');grid.innerHTML='';grid.className='answer-grid'+(t.matrix?' matrix':'');function cell(col,label,on,ok,bad,mark,action){const bx=document.createElement('button');bx.className='box'+(done?(ok?' right':bad?' wrong':'')+' locked':on?' on':'');bx.textContent=done?(ok?'✓':bad?'✕':mark):mark;bx.setAttribute('aria-label',label);bx.setAttribute('aria-pressed',String(on));bx.setAttribute('aria-disabled',String(done));bx.onclick=action;col.appendChild(bx);}if(t.matrix){t.cols.forEach((cl,ci)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=cl;col.appendChild(b);labels.forEach((L,ri)=>{const on=p[ci]===ri;cell(col,'Для '+cl+' — '+L,on,c[ci]===ri,on&&c[ci]!==ri,L,()=>pickCell(ci,ri));});grid.appendChild(col);});}else{labels.forEach((L,i)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=L;col.appendChild(b);const on=p.includes(i),pos=p.indexOf(i),ok=t.ordered?on&&c[pos]===i:c.includes(i);cell(col,'Відповідь '+L,on,ok,on&&!ok,on?(t.ordered?String(pos+1):'✓'):'',()=>pick(i));grid.appendChild(col);});}renderExplain(t);paintNums();save();}
function pick(i){if(isDone(current))return;const t=tasks[current],s=state[current],k=s.picked.indexOf(i);if(k>=0)s.picked.splice(k,1);else if(t.multi){if(s.picked.length<t.multi)s.picked.push(i);}else s.picked=[i];render();}
function pickCell(ci,ri){if(isDone(current))return;const p=state[current].picked;if(p[ci]===ri)p[ci]=null;else{while(p.length<=ci)p.push(null);p[ci]=ri;}while(p.length&&p[p.length-1]==null)p.pop();render();}
function go(i){current=Math.max(0,Math.min(TOTAL-1,i));render();window.scrollTo({top:0});}
$('skip').onclick=()=>go(current+1>=TOTAL?0:current+1);$('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',updateToTop,{passive:true});document.addEventListener('keydown',e=>{if(inTheory||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1);}});$('total').textContent=TOTAL;buildNums();buildTheory();render();showTheory();
</script></body></html>
