      "Народився у родині шляхтичів на Київщині. У Київському університеті закінчив два факультети: медичний та історико-філологічний. Працював учителем у київській гімназії, головним редактором Тимчасової комісії для розгляду давніх актів при канцелярії київського генерал-губернатора. Автор понад 300 праць з історії, археології та етнографії України, Антонович створив так звану «київську школу» істориків, до якої увійшли Д. Багалій, М. Грушевський та ін. Його вважають одним із батьків української археології. ",
      "Наукову роботу Антонович поєднував із громадсько-культурною діяльністю. Він став одним з організаторів Старої громади. Про будинок В. Антоновича київський генерал-губернатор М. Чортков заявляв: «Українське питання завершиться тільки тоді, коли я з корінням винищу цю хату на розі Кузнечної та Жилянської вулиць».<b>Постаті в історії</b>",

      "Народився на Полтавщині в небагатій дворянській сім&#x27;ї. Під час навчання на юридичному факультеті Петербурзького університету познайомився з видатними географами Петром Семеновим-Тянь-Шанським, Миколою Пржевальським, Миколою Миклухо-Маклаєм, що вплинуло на інтереси юнака. Брав участь у діяльності петербурзької української громади, був автором журналу «Основа». 1861 року Чубинський захистив дисертацію «Нариси народних юридичних звичаїв і понять з цивільного права Малоросії» й здобув учений ступінь кандидата правознавства. Повернувшись в Україну, він вступив до Київської громади. Саме тоді Чубинський написав текст пісні, що нині є Державним Гімном України. За українську діяльність вченого було заслано до Архангельської губернії. Після повернення до України він працював секретарем та заступником голови Південно-Західного відділу Російського географічного товариства. Проте після видання Емського указу на нього чекало нове заслання, і лише завдяки клопотанню Російського географічного товариства Чубинський дістав дозвіл проживати в Петербурзі. "

      "<b>Борис Грінченко</b> (1863–1910) — письменник, учений, освітній і громадський діяч.",
      "Народився на Харківщині в родині відставного офіцера. У 16 років Бориса заарештували за читання забороненої літератури, внаслідок чого Харківський університет йому довелося закінчувати екстерном. Грінченко вчителював, згодом переїхав до Чернігова, де разом із дружиною брав участь у роботі земства, громади та музею української старожитності В. Тарновського. Він видав близько 50 книжок для народу загальним накладом 200 тис. примірників. 1902 р. Грінченко бере участь у створенні «Словаря української мови» під патронатом часопису «Київська старовина», що був удостоєний Російською академією наук другої премії М. Костомарова. Брав автором низки драматичних творів, кількох повістей, близько 50 оповідань, шести поетичних збірок. Займався і перекладами з російської та німецької мов — прози, поезії, драми. 1892 р. Грінченко став одним із засновників Братства тарасівців, що ставило за мету здобуття незалежності України. Пізніше вступив до Української радикальної партії, а з 1906 по 1909 рр. очолював Київську «Просвіту». Помер в Італії і був похований у Києві. "

      "<b></b><b>Олександр Кониський</b> (1836–1900) — український письменник, публіцист і громадський діяч. Походив з давнього дворянського роду на Чернігівщині. Брав членом Київської громади, організовував недільні школи, для яких готував українські прописи й підручники. Після Валуєвського циркуляру був засланий, дев&#x27;ять років жив під поліцейським наглядом. 1873 р. став одним з ініціаторів заснування Літературного товариства ім. Шевченка у Львові, а згодом — його перейменування на Наукове. 1898 р. видав двотомну біографію Тараса Шевченка. Автор пісні «Молитва за Україну». Брав публічним захисником українських інтересів, 1888 р. написав відкритого листа Міністру внутрішніх справ із вимогою припинити переслідування українського слова. Його можна назвати передвісником знаменитого гасла М. Хвильового «Геть від Москви!», адже ще в XIX ст. О. Кониський зауважував, що через російську культуру відбувається зросійщення. Водночас він був готовий іти на максимальні компроміси заради української справи. ",

      "<b></b><b>Михайло Драгоманов</b> (1841–1895) народився в Гадячі на Полтавщині. Рідний брат української письменниці О. Пчілки, матері Лесі Українки. За незаконні погляди був відрахований з останнього класу гімназії без права вступати до іншого навчального закладу, тому закінчував навчання екстерном. Працював у Київському університеті. Активний учасник «Старої громади» та Південно-Західного відділу Російського географічного товариства. Після звільнення з Київського університету за наказом Олександра ІІ виїхав за кордон. З 1889 р. працював у Софійському університеті. Болгарський уряд не видав Драгоманова російським властям. Залишив ім&#x27;я в історії як громадський діяч, історик, літературознавець, економіст, публіцист, філософ. ",

let current=0,inTheory=false;const state=tasks.map(()=>({picked:[]}));
function isDone(i){const t=tasks[i],p=state[i].picked;return t.matrix?p.length===4&&p.every(Number.isInteger):p.length===(t.multi||1);}
function isRight(i){const t=tasks[i],p=state[i].picked,c=correctSet(t);return p.length===c.length&&(t.matrix?c.every((x,k)=>p[k]===x):c.every(x=>p.includes(x)));}
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&Array.isArray(s.state)&&s.state.length===TOTAL){s.state.forEach((v,i)=>{if(!v||!Array.isArray(v.picked))return;const t=tasks[i],p=v.picked;if(p.length<=(t.multi||1)&&p.every(x=>(t.matrix&&x===null)||(Number.isInteger(x)&&x>=0&&x<t.options.length))&&(t.matrix||new Set(p).size===p.length))state[i].picked=p;});if(Number.isInteger(s.current))current=Math.max(0,Math.min(TOTAL-1,s.current));}}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify({state,current}));localStorage.setItem('progress-topic-'+TOPIC_ID,JSON.stringify({answered:state.filter((_,i)=>isDone(i)).length,total:TOTAL}));}catch(e){}}
function buildNums(){const box=$('nums');const b=document.createElement('button');b.id='tBtn';b.className='num theory-btn';b.textContent='Т';b.setAttribute('aria-label','Теорія');b.onclick=showTheory;box.appendChild(b);tasks.forEach((_,i)=>{const b=document.createElement('button');b.className='num';b.dataset.i=i;b.textContent=i+1;b.setAttribute('aria-label','Завдання '+(i+1));b.onclick=()=>go(i);box.appendChild(b);});}
function paintNums(){[...$('nums').children].forEach(b=>{if(b.id==='tBtn'){b.className='num theory-btn'+(inTheory?' current':'');return;}const i=+b.dataset.i;b.className='num';if(state[i].picked.length)b.classList.add(isDone(i)?isRight(i)?'correct':'wrong':'answered');if(!inTheory&&current===i)b.classList.add('current');});}
function buildTheory(){const v=$('theoryView');v.innerHTML='<h2 class="theory-title">Теорія</h2>';theory.forEach((item,i)=>{const d=document.createElement('div');d.className='theory-block';d.id='theory-'+i;const h=document.createElement('h3');h.textContent=item.h;d.appendChild(h);const ul=document.createElement('ul');item.list.forEach(x=>{const li=document.createElement('li');li.innerHTML=x;ul.appendChild(li);});d.appendChild(ul);v.appendChild(d);});}
function updateToTop(){$('toTop').classList.toggle('show',inTheory&&window.scrollY>200);}
function showTheory(){inTheory=true;$('testView').classList.add('hidden');$('theoryView').classList.remove('hidden');$('counter').textContent='Теорія';paintNums();window.scrollTo({top:0});updateToTop();}
function showTheoryAt(i){showTheory();$('theory-'+i).scrollIntoView({behavior:'smooth',block:'start'});}
function renderExplain(t){const box=$('explain');if(!isDone(current)){box.className='explain hidden';box.innerHTML='';return;}const right=isRight(current),labels=labelsOf(t),c=correctSet(t);const ans=t.matrix?c.map((x,k)=>(k+1)+'–'+labels[x]).join(', '):c.map(x=>labels[x]).join(', ');box.className='explain '+(right?'good':'bad');box.innerHTML='<div class="score">Правильна відповідь: <b>'+ans+'</b>. Бали: '+(right?1:0)+' з 1. Після показу відповіді змінити її вже не можна.</div><h4>Чому так</h4><p class="why"></p><p class="repeat">Повторити: <a href="#" id="repeatLink"></a></p>';box.querySelector('.why').textContent=(t.matrix?c.map((x,k)=>(k+1)+' — '+t.options[x]).join('; '):'Правильна відповідь: '+c.map(x=>t.options[x]).join('; '))+'.'+(t.note?' '+t.note:'');if(t.source){const a=document.createElement('a');a.href=t.source;a.textContent=' Перевірене джерело';a.target='_blank';a.rel='noopener';box.querySelector('.why').appendChild(a);}const a=$('repeatLink');a.textContent=theory[t.repeat].h;a.onclick=e=>{e.preventDefault();showTheoryAt(t.repeat);};}
function render(){inTheory=false;updateToTop();$('theoryView').classList.add('hidden');$('testView').classList.remove('hidden');const t=tasks[current],p=state[current].picked,labels=labelsOf(t),done=isDone(current),c=correctSet(t);$('counter').textContent='Завдання '+(current+1)+' з '+TOTAL;const q=$('question');q.textContent='';const b=document.createElement('b');b.textContent=t.id+' ';q.append(b,document.createTextNode(t.q));$('answersLabel').textContent=t.matrix?'Установіть відповідності для кожного стовпця:':t.multi?'Позначте відповіді (потрібно обрати '+t.multi+'):':'Позначте відповіді:';
const ul=$('options');ul.innerHTML='';t.options.forEach((text,i)=>{const li=document.createElement('li');let cls=t.matrix?'option locked':'option'+(p.includes(i)?' selected':'');if(done&&!t.matrix){if(c.includes(i))cls+=' right';else if(p.includes(i))cls+=' wrong';cls+=' locked';}li.className=cls;li.tabIndex=t.matrix?-1:0;li.innerHTML='<span class="letter"></span><span class="txt"></span>';li.querySelector('.letter').textContent=/\bright\b/.test(cls)?'✓':/\bwrong\b/.test(cls)?'✕':labels[i];li.querySelector('.txt').textContent=text;if(!t.matrix){li.setAttribute('role','button');li.setAttribute('aria-disabled',String(done));li.onclick=()=>pick(i);li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(i);}};}ul.appendChild(li);});
const grid=$('answerGrid');grid.innerHTML='';grid.className='answer-grid'+(t.matrix?' matrix':'');function cell(col,label,on,ok,bad,mark,action){const bx=document.createElement('button');bx.className='box'+(done?(ok?' right':bad?' wrong':'')+' locked':on?' on':'');bx.textContent=done?(ok?'✓':bad?'✕':mark):mark;bx.setAttribute('aria-label',label);bx.setAttribute('aria-pressed',String(on));bx.setAttribute('aria-disabled',String(done));bx.onclick=action;col.appendChild(bx);}if(t.matrix){['1','2','3','4'].forEach((cl,ci)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=cl;col.appendChild(b);labels.forEach((L,ri)=>{const on=p[ci]===ri;cell(col,'Для '+cl+' — '+L,on,c[ci]===ri,on&&c[ci]!==ri,L,()=>pickCell(ci,ri));});grid.appendChild(col);});}else{labels.forEach((L,i)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=L;col.appendChild(b);const on=p.includes(i),ok=c.includes(i);cell(col,'Відповідь '+L,on,ok,on&&!ok,on?'✓':'',()=>pick(i));grid.appendChild(col);});}renderExplain(t);paintNums();save();}
function pick(i){if(isDone(current))return;const t=tasks[current],s=state[current],k=s.picked.indexOf(i);if(k>=0)s.picked.splice(k,1);else if(t.multi){if(s.picked.length<t.multi)s.picked.push(i);}else s.picked=[i];render();}
function pickCell(ci,ri){if(isDone(current))return;const p=state[current].picked;if(p[ci]===ri)p[ci]=null;else{while(p.length<=ci)p.push(null);p[ci]=ri;}while(p.length&&p[p.length-1]==null)p.pop();render();}
function go(i){current=Math.max(0,Math.min(TOTAL-1,i));render();window.scrollTo({top:0});}
$('skip').onclick=()=>go(current+1>=TOTAL?0:current+1);$('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',updateToTop,{passive:true});document.addEventListener('keydown',e=>{if(inTheory||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1);}});$('total').textContent=TOTAL;buildNums();buildTheory();render();showTheory();
</script></body></html>
