<head>

<title>Тема 3. Русь-Україна (Київська держава)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=swap&amp;subset=latin-ext" rel="stylesheet">
<style>
  :root {
    --cell: 36px; --cell-font: 16px; --green: #00bc8c; --green-dark: #00a077;
    --border: #00bc8c; --label: #00bc8c; --red: #e74c3c; --grey-btn: #444444;
    --grey-box: #303030; --active-bg: #0b5c49; --text: #ffffff; --muted: #c8c8c8;
    --bg: #222222; --panel: #303030; --line: #444444; --ok: #00bc8c; --bad: #e74c3c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Lato", "Segoe UI", Arial, sans-serif; font-size: 17px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 24px 60px; }
  .topbar { display: flex; gap: 10px; align-items: stretch; margin: 4px 0 18px; }
  .home-btn { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 9px 18px; border: 1px solid var(--green); color: var(--text); background: transparent; font-size: 17px; text-decoration: none; cursor: pointer; transition: background .15s; }
  .home-btn:hover { background: var(--green); }
  .home-btn:focus-visible { outline: 3px solid #3498db; outline-offset: 2px; }
  .top-line { border-top: 2px solid #444444; margin-bottom: 12px; }
  .meta div { line-height: 1.75; font-size: 18px; }
  .meta span { color: var(--muted); } .meta b { color: var(--text); }
  .nums { display: flex; flex-wrap: wrap; gap: 13px 13px; margin: 26px 0 22px; }
  .num { width: var(--cell); height: var(--cell); flex: 0 0 var(--cell); border: 1px solid var(--border); background: var(--panel); font: inherit; font-size: var(--cell-font); line-height: 1; color: var(--text); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .num.done, .num.seen { border-color: var(--border); }
  .num.current { background: var(--active-bg); box-shadow: 0 0 6px 2px rgba(0,188,140,.55); border-color: var(--border); }
  .num.correct { background: #0b5c49; } .num.wrong { background: #6b2620; border-color: var(--bad); }
  .num.answered { background: #1d4a40; }
  .divider { position: relative; text-align: right; margin: 30px 0 40px; height: 40px; }
  .divider::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
  .counter { position: relative; display: inline-block; padding: 8px 14px; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: 17px; }
  .question { font-size: 18px; margin: 0 0 22px; line-height: 1.5; white-space: pre-line; }
  .question em { display: block; margin-top: 12px; color: var(--muted); font-size: 16px; }
  .options { margin: 0 0 30px; padding: 0; list-style: none; }
  .option { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 6px; cursor: pointer; max-width: 100%; }
  .option .letter { background: var(--grey-box); width: var(--cell); height: var(--cell); flex: 0 0 var(--cell); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--cell-font); line-height: 1; }
  .option .txt { font-size: 18px; line-height: 1.4; padding-top: 6px; }
  .option.selected .letter { background: var(--active-bg); box-shadow: inset 0 0 0 1px var(--border); }
  .option.right .letter { background: var(--ok); color: #fff; } .option.wrong .letter { background: var(--bad); color: #fff; }
  .answers-label { font-size: 18px; margin: 0 0 10px; }
  .answer-grid { display: flex; gap: 7px; margin-bottom: 26px; }
  .answer-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .answer-col b { font-size: var(--cell-font); width: var(--cell); text-align: center; }
  .box { width: var(--cell); height: var(--cell); flex: 0 0 var(--cell); border: 1px solid #555555; border-radius: 4px; background: var(--panel); cursor: pointer; font-size: var(--cell-font); line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--text); }
  .box.on { background: var(--active-bg); border-color: var(--border); color: #fff; }
  .option.locked, .box.locked { cursor: default; }
  .box.right { background: var(--ok); border-color: var(--ok); color: #fff; }
  .box.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .matrix .box.on { background: var(--green); border-color: var(--green); }
  .row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; }
  .btn { display: block; width: 212px; height: 43px; border: 0; font: inherit; font-size: 17px; color: #fff; background: var(--green); cursor: pointer; }
  .btn:hover { background: var(--green-dark); }
  .btn.red { background: var(--red); width: 213px; } .btn.red:hover { background: #d43f2f; }
  .btn.grey { background: var(--grey-btn); color: var(--text); } .btn.grey:hover { background: #555555; }
  .left { display: flex; flex-direction: column; gap: 20px; }
  .btn:focus-visible, .num:focus-visible, .box:focus-visible, .option:focus-visible { outline: 3px solid #3498db; outline-offset: 2px; }
  .explain { margin-top: 24px; padding: 18px 20px; border-left: 4px solid var(--border); background: var(--panel); color: var(--text); font-size: 17px; line-height: 1.55; }
  .explain.good { border-left-color: var(--ok); } .explain.bad { border-left-color: var(--bad); }
  .explain .score b { font-weight: 700; }
  .explain h4 { margin: 16px 0 4px; font-size: 17px; font-weight: 700; color: var(--green); }
  .explain .why { margin: 0; }
  .explain .repeat { margin: 16px 0 0; font-size: 15px; color: #9a9a9a; }
  .explain .repeat a { color: var(--green); text-decoration: underline; cursor: pointer; }
  .hidden { display: none; }
  .num.theory-btn { font-weight: 700; }
  .theory-title { font-size: 24px; margin: 0 0 6px; font-weight: 700; }
  .theory-block { padding: 18px 0; border-top: 1px solid var(--line); }
  .theory-block:first-of-type { border-top: 0; }
  .theory-block h3 { margin: 0 0 8px; font-size: 18px; color: var(--green); font-weight: 700; }
  .theory-block p { margin: 0; font-size: 18px; line-height: 1.6; color: var(--muted); }
  .theory-block b { color: var(--text); font-weight: 700; }
  .theory-end { border-top: 1px solid var(--line); }
  .theory-block ul { margin: 6px 0 0; padding-left: 22px; color: var(--muted); font-size: 18px; line-height: 1.6; }
  .theory-block li { margin: 0 0 6px; } .theory-block p + ul { margin-top: 10px; }
  .theory-block blockquote { margin: 0; padding: 10px 14px; border-left: 4px solid var(--green); background: var(--panel); color: var(--muted); font-size: 17px; line-height: 1.6; font-style: italic; }
  .theory-block blockquote + ul, .theory-block ul + p.after, .theory-block blockquote + p.after { margin-top: 12px; }
  .theory-block p.after { margin-top: 12px; }
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; z-index: 90; }
  .drawer-overlay.open { opacity: 1; visibility: visible; }
  .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(360px, 88vw); background: var(--bg); border-right: 1px solid var(--line); padding: 18px 16px 24px; overflow-y: auto; overscroll-behavior: contain; transform: translateX(-100%); visibility: hidden; transition: transform .22s ease, visibility .22s; z-index: 100; }
  .drawer.open { transform: none; visibility: visible; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .drawer-head h2 { margin: 0; font-size: 28px; font-weight: 700; }
  .drawer-close { width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 18px; cursor: pointer; }
  .drawer-close:hover { background: var(--panel); }
  .topic-search { width: 100%; padding: 9px 10px; margin-bottom: 14px; border: 0; border-radius: 3px; background: #fff; color: #222; font: inherit; font-size: 15px; }
  .topic-search::placeholder { color: #888; } .topic-list { list-style: none; margin: 0; padding: 0; }
  .to-top { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); width: 48px; height: 48px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: var(--green); color: #fff; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.5); opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .2s, transform .2s, visibility .2s, background .15s; z-index: 50; }
  .to-top.show { opacity: 1; visibility: visible; transform: none; }
  .to-top:hover { background: var(--green-dark); }
  .to-top:focus-visible { outline: 3px solid #3498db; outline-offset: 3px; }
  @media (max-width: 560px) { .wrap { padding: 12px 14px 40px; } :root { --cell: 32px; --cell-font: 14px; } .nums { gap: 9px; } .btn, .btn.red { width: 100%; } .left { width: 100%; } .row { flex-direction: column; } .right { width: 100%; } }
</style>

eat": "Перші київські князі династії Рюриковичів (кінець IX–X ст.)"}}, {"id": "3.5.", "q": "Уздовж якого торгового шляху виникла Руська держава?", "options": ["Великого шовкового", "Залізного", "Солоного", "«із варяг у греки»"], "correct": 3, "labels": ["А", "Б", "В", "Г"], "explain": {"why": "За наданим матеріалом правильна відповідь: «із варяг у греки».", "repeat": "Заснування Києва"}}, {"id": "3.6.", "q": "Які держави розгромив Святослав?", "options": ["Візантію та Аварський каганат", "Хозарський каганат і Волзьку Булгарію", "Польське королівство і Хозарський каганат", "Болгарське царство і Візантію"], "correct": 1, "labels": ["А", "Б", "В", "Г"], "explain": {"why": "За наданим матеріалом правильна відповідь: Хозарський каганат і Волзьку Булгарію.", "repeat": "Перші київські князі династії Рюриковичів (кінець IX–X ст.)"}}, {"id": "3.7.", "q": "Що з названого не було наслідком походів Святослава?", "options": ["послаблення держави численними війнами", "зруйнування кордону між степом і Руссю", "розширення територій Русі-України", "зміцнення русько-візантійського військового союзу"], "correct": 3, "labels": ["А", "Б", "В", "Г"], "explain": {"why": "За наданим матеріалом правильна відповідь: зміцнення русько-візантійського військового союзу.", "repeat": "Перші київські князі династії Рюриковичів (кінець IX–X ст.)"}}, {"id": "3.8.", "q": "Якого року відбулася подія? «І вискочили всі вої з човнів, і мовив Олег Аскольдові й Дірові: \"Ви оба не є ні князі, ні роду княжого. А я є роду княжого. — І винесли Ігоря. — А се — син Рюриків...\"»", "options": ["860 р.", "882 р.", "907 р.", "941 р."], "correct": 1, "labels": ["А", "Б", "В", "Г"], "explain": {"why": "За наданим матеріалом правильна відповідь: 882 р..", "repeat": "Дати"}}, {"id": "3.9.", "q": "Коли відбулася зазначена подія: «Якщо не з'явиться хто завтра на ріці — багатий чи убогий, чи старець, чи раб, — то мені той противником буде»?", "options": ["860 р.", "907 р.", "988 р.", "1036 р."], "correct": 2, "labels": [" а ж повелів він прив’язати коневі до хвоста і волочити з гори по Боричевому узвозу...»\n4) «Уже нам нікуди дітись... Тож не осоромимо землі Руської, а ляжемо кістьми тут, бо ж мертвий сорому не зазнає...»", "options": ["Ігор", "Святослав", "Володимир Великий", "Олег", "Ярослав Мудрий"], "correct": [3, 0, 2, 1], "answerText": "1Г 2А 3В 4Б", "matrix": true, "multi": 4, "cols": ["1", "2", "3", "4"], "labels": ["А", "Б", "В", "Г", "Д"], "hint": "Позначте відповідність: для кожного номера оберіть одну літеру.", "explain": {"why": "Відповідності за наданим матеріалом: 1 — Олег; 2 — Ігор; 3 — Володимир Великий; 4 — Святослав.", "repeat": "Перші київські князі династії Рюриковичів (кінець IX–X ст.)"}}, {"id": "3.17.", "q": "Увідповідніть події з датами.\n\n1) створення Остромирового Євангелія\n2) перша згадка назви «Україна»\n3) Любецький з’їзд князів\n4) розгром печенігів Ярославом Мудрим", "options": ["1036 р.", "1097 р.", "1187 р.", "1056–1057 рр.", "1256 р."], "correct": [3, 2, 1, 0], "answerText": "1Г 2В 3Б 4А", "matrix": true, "multi": 4, "cols": ["1", "2", "3", "4"], "labels": ["А", "Б", "В", "Г", "Д"], "hint": "Позначте відповідність: для кожного номера оберіть одну літеру.", "explain": {"why": "Відповідності за наданим матеріалом: 1 — 1056–1057 рр.; 2 — 1187 р.; 3 — 1097 р.; 4 — 1036 р..", "repeat": "Дати"}}, {"id": "3.18.", "q": "Увідповідніть назву твору з його автором.\n\n1) «Слово про закон і благодать»\n2) «Повість минулих літ»\n3) «Повчання дітям»\n4) «Слово о полку Ігоревім»", "options": ["Ярослав Мудрий", "Нестор", "Володимир Мономах", "Іларіон", "анонім"], "correct": [3, 1, 2, 4], "answerText": "1Г 2Б 3В 4Д", "matrix": true, "multi": 4, "cols": ["1", "2", "3", "4"], "labels": ["А", "Б", "В", "Г", "Д"], "hint": "Позначте відповідність: для кожного номера оберіть одну літеру.", "explain": {"why": "Відповідності за наданим матеріалом: 1 — Іларіон; 2 — Нестор; 3 — Володимир Мономах; 4 — анонім.", "repeat": "Культура Київської держави"}}, {"id": "3.19.", "q": "Що характеризує діяльність Олега? (оберіть три)", "options": ["походи на Візантію 941 і 944 років", "проведення податкової реформи", "підкорення Києву сіверян, деревлян, радимичів", "укладення вигідного торгового договору з Візантією", "загибель від рук печенігів", "перша спроба запровадження християнства як державної релігії", "визначення Києва як «матері городам руським»"], "correct": [2, 3, 6], "multi": 3, "labels": ["1", "2", "3", "4", "5", "6", "7"], "explain": {"why": "Правильні ознаки за наданим матеріалом: підкорення Києву сіверян, деревлян, радимичів; укладення вигідного торгового договору з Візантією; визначення Києва як «матері городам руським».", "repeat": "Перші київські князі династії Рюриковичів (кінець IX–X ст.)"}}, {"id": "3.20.", "q": "Укажіть значення прийняття християнства на Русі. (оберіть три)", "options": ["дало поштовх розвитку ремесел, особливо в архітектурі", "впроваджена писемність — глаголиця", "укріпилася великокнязівська влада", "почалося літописання, поширилися книги", "укріпилися відносини з Арабським халіфатом", "сприяло об'єднанню Русі з Візантією в одну державу", "на Русі поширилося книгодрукування"], "correct": [0, 2, 3], "multi": 3, "labels": ["1", "2", "3", "4", "5", "6", "7"], "explain": {"why": "Правильні ознаки за наданим матеріалом: дало поштовх розвитку ремесел, особливо в архітектурі; укріпилася великокнязівська влада; почалося літописання, поширилися книги.", "repeat": "Князювання Володимира Великого і Ярослава Мудрого (кінець X — перша половина XI ст.)"}}];
const theory = [{"h": "Зміст програми", "p": "Факти. Розселення східнослов'янських племінних союзів (поляни, деревляни, сіверяни, уличі, дуліби, бужани, волиняни, тиверці, білі хорвати). Назва «Русь». Утворення Руської держави (Русі-України). Внутрішня та зовнішньополітична діяльність перших київських князів. Державотворча діяльність Володимира Великого. Запровадження християнства як державної релігії. Русь-Україна за Ярослава Мудрого. «Руська правда». Правління наступників Ярослава Мудрого. Боротьба з половецькою загрозою. Роздробленість Русі-України (Київської Русі)."}, {"h": "Дати", "list": ["860 р. — похід Аскольда на Константинополь.", "882 р. — об'єднання північних та південних руських земель Олегом.", "907, 911, 941, 944 рр. — походи князів на Константинополь, укладення першого договору Русі з Візантією.", "988 р. — запровадження християнства як державної релігії.", "1036 р. — розгром печенігів Ярославом Мудрим під Києвом.", "1056–1057 рр. — створення Остромирового Євангелія.", "1097 р. — Любецький з'їзд князів.", "1113 р. — укладення «Повісті минулих літ» (Нестор); початок правління Володимира Мономаха.", "1187 р. — створення «Слова о полку Ігоревім»; перша згадка назви «Україна» в літописі."]}, {"h": "Поняття та терміни", "list": ["Племінний союз — об'єднання кількох племен.", "Князь — голова племені або союзу племен, пізніше — спадковий титул монарха.", "Полюддя — збирання князем з дружиною або його представниками данини з підлеглого населення.", "Язичництво — релігія, що ґрунтується на вірі в багатьох богів, які уособлювали сили природи.", "Християнство — одна з трьох світових релігій (поряд із буддизмом та ісламом), що ґрунтується на вірі в Ісуса Христа як боголюдину.", "Шлюбна дипломатія — встановлення дипломатичних відносин шляхом укладання шлюбів між представниками правлячих родів різних країн.", "Політична роздробленість — поділ середньовічної держави на малі та великі володіння, які не мали централізованої влади.", "Віче — загальні збори громадян міст Київської Русі для розгляду громадських справ.", "Вотчина — землі, що переходили у спадщину в повну і безумовну власність.", "Бояри — представники правлячого стану, які посідали друге, після князів, становище в управлінні державою.", "Смерди — вільні селяни, які сплачували данину державі.", "Ізгої — категорія неповноправних людей, які вийшли зі свого звичайного суспільного середовища.", "Закупи — залежні селяни, які мали відпрацювати позику (купу), взяту у феодала.", "Ікони — зображення Ісуса Христа, Богородиці, святих і подій Святого Письма.", "Билини — фольклорні епічні пісні про воїнів-богатирів та їхні подвиги.", "Літопис — історико-літературний твір, у якому оповідь велася за роками.", "Мозаїка — зображення чи візерунок із кольорових каменів, смальти (скла), керамічних плиток. Фреска — настінний живопис водяними фарбами по вологій штукатурці. Книжкова мініатюра — зроблений від руки малюнок, ілюстрація в рукописній книзі."]}, {"h": "Розселення східнослов’янських племінних союзів", "p": "У VIII–IX ст. почалося формування слов'янських племінних союзів. Племена складались із родів, очолюваних старійшинами, а племінний союз очолював вождь, якому належала верховна влада. У «Повісті минулих літ» згадуються такі племінні союзи на теренах України наприкінці VIII ст.:", "list": ["поляни — у Середньому Подніпров'ї;", "деревляни — у басейні Прип'яті;", "дуліби — на Волині (згодом поділилися на волинян і бужан);", "уличі — між Південним Бугом і Дніпром;", "тиверці — між Прутом і Дністром;", "білі хорвати — у Карпатському регіоні;", "сіверяни — на Лівобережжі Дніпра."], "after": "З часом саме вони стали основою формування українського народу."}, {"h": "Заснування Києва", "list": ["Близько VI ст. було засновано місто Київ — центр полянського племінного союзу. Легендарний засновник міста, полянський князь Кий, був реальною історичною особою.", "Київ був розташований на шляху «із варяг у греки» і став центром новоствореної держави — Київської держави (Русі-України). Під назвою Куяба (Куявія) Київ щонайменше з IX ст. був відомий в арабських, візантійських і західноєвропейських джерелах."]}, {"h": "Походження назви «Русь»", "list": ["Руською землею називали територію сучасних Київщини, Чернігівщини, Переяславщини (землі полян, деревлян, сіверян).", "Найпоширенішим є погляд про давньоскандинавське походження слова (корінь «рос» — «веслування», «морський похід на веслових суднах»): русами (росами) називали скандинавських мореплавців — вікінгів, або варягів. Єдиного погляду на походження назви не існує. Наприкінці XI — на початку XII ст. слова «русь», «русин» стають самоназвою населення Південної Русі."]}, {"h": "Утворення Русі-України (Київської держави)", "list": ["У VIII–IX ст. сформувалося кілька східнослов'янських князівств із центрами в Києві, Чернігові тощо. У середині IX ст. київськими правителями, за літописом, були Аскольд і Дір.", "Аскольд і Дір: підпорядкували Києву деревлян, дреговичів, частину сіверян; 860 р. Аскольд здійснив морський похід на Константинополь, де прийняв християнство, і спробував запровадити його на Русі; шлях «із варяг у греки». 875 р. між Руссю та Візантією укладено угоду про ненапад; у договорі вперше згадано «Руську землю».", "Заснування династії Рюриковичів. Близько 862 р. новгородці запросили на князювання варяга-руса Рюрика. Після його смерті влада перейшла до Олега, який мав правити до повноліття малолітнього Ігоря Рюриковича. 882 р. Олег з Ігорем і дружиною прибув до Києва, підступом убив Аскольда і Діра, мотивуючи тим, що лише нащадок Рюрика може бути правителем, і таким чином об'єднав північ і південь Русі.", "Норманісти і антинорманісти. Літописна розповідь стала підґрунтям для суперечок щодо ролі норманів у формуванні слов'янської державності. Норманісти стверджували провідну роль варягів; антинорманісти заперечували участь варягів у державотворенні. Сучасні історики вважають, що варяги відіграли значну, але не вирішальну роль, бо становили лише військову верхівку."]}, {"h": "Перші київські князі династії Рюриковичів (кінець IX–X ст.)", "list": ["Олег (882–912): розширив кордони держави, підпорядкувавши Києву сіверян, радимичів, деревлян, а також неслов'янські племена меря, чудь і весь; засновував нові міста і фортеці, назвавши Київ «матір'ю городам руським»; 907 та 911 рр. здійснив вдалі походи проти Візантії, наслідком яких став вигідний торговий договір — руські купці торгували без мита та проживали в Константинополі за рахунок імператора. За легендою, помер від укусу змії.", "Ігор (912–945): син Рюрика; відновив владу над повсталими деревлянами й уличами; першим зіткнувся з печенігами; здійснив похід на Закавказзя; 941 р. руські кораблі були знищені «грецьким вогнем» — Русь втратила привілеї в торгівлі з Константинополем; 944 р. уклав новий договір. Убитий деревлянами під час повстання проти повторного збору данини — полюддя.", "Ольга (945–964): вдова Ігоря, правила до повноліття сина Святослава. Придушила повстання деревлян, ліквідувавши місцеве князівство; провела податкову реформу — визначила обсяги данини (уроки), місця збору (погости) і порядок підвозу (устави). Відвідала Константинополь і, за літописом, прийняла християнство; спробувала запровадити його як державну релігію, запросила місію єпископа зі Священної Римської імперії (Адальберта), проте християнізації держави не вдалося здійснити. Визнана святою, рівноапостольною.", "Святослав (964–972): син Ігоря й Ольги; прибічник язичництва; полководець-воїн. Розгромив Хозарський каганат і Волзьку Булгарію; приєднав в'ятичів; воював на Балканах із Болгарією та Візантією (облога Доростола, договір 971 р.); повертаючись, загинув 972 р. від рук печенігів князя Каґрі; череп князя використали як чашу. Його походи послабили державу, зруйнували кордон між степом і Руссю, проте не зміцнили русько-візантійський союз."]}, {"h": "Князювання Володимира Великого і Ярослава Мудрого (кінець X — перша половина XI ст.)", "list": ["Володимир Великий (980–1015): молодший син Святослава; став київським князем унаслідок війни з братами. Остаточно підкорив тиверців, уличів, в'ятичів, радимичів; захопив Червенські міста (Перемишль, Белз, Червень); приєднав Закарпаття і Придністров'я; утворилося Тмутараканське князівство. Територія держави простягалася від Ладозького та Онезького озер до Південного Бугу, від Карпат до межиріччя Оки і Волги.", "Внутрішня політика Володимира: остаточно ліквідував племінні князівства, призначивши намісниками своїх синів; сформував військо з дружинників-слов'ян; почав карбувати золоті і срібні монети (златники і срібники) із зображенням князя та тризубом; для оборони від печенігів збудував лінії укріплень з гарнізонами; у «місті Володимира» в Києві збудував Десятинну церкву (церкву Пресвятої Богородиці).", "Хрещення Русі (988 р.). Володимир спершу спробував реформувати язичництво (пантеон Перуна, Хорса, Дажбога, Стрибога, Симаргла, Мокоші), а потім прийняв християнство за візантійським обрядом (одружившись із візантійською царівною Анною) і охрестив киян у Дніпрі.", "Значення хрещення: зміцнилася князівська влада; зросло міжнародне становище Київської Русі; християнство сприяло об'єднанню руських земель; дало поштовх розвитку писемності, архітектури, живопису, освіти, перекладацької справи і зрівняло Русь з європейськими державами.", "Ярослав Мудрий (1019–1054): після смерті батька, внаслідок міжусобної боротьби з братами (Святополком, Мстиславом), посів київський престіл; до 1036 р. Русь ділили по Дніпру з братом Мстиславом, що володів Лівобережжям із центром у Чернігові. Після смерті Мстислава (1036) став одноосібним правителем.", "Зовнішня політика Ярослава: приєднав частину Прибалтики (Юр'єв), відвоював Червенські міста; 1036 р. розбив печенігів під Києвом, ліквідувавши постійну загрозу; здійснив похід на Візантію (1043, невдалий); став «тестем Європи» завдяки шлюбній дипломатії — Анна одружилася з королем Франції Генріхом I, Єлизавета — з норвезьким королем Гаральдом, Анастасія — з угорським королем; сам був одружений із дочкою шведського короля Інгігердою.", "Внутрішня політика і культура: уклав перший писаний звід законів — «Руську правду»; опікувався Києвом — збудував Золоті ворота, Софійський собор, монастирі Св. Георгія та Св. Ірини; при Софії заснував бібліотеку; Києво-Печерський монастир заснований Антонієм Печерським; поставив на митрополію Іларіона (1051 р.) — першого русина-митрополита.", "Заповіт Ярослава: поділив землі між синами, запровадив лествичний порядок успадкування великокнязівського престолу (від старшого брата до молодшого). Старші сини отримали головні міста: Ізяслав — Київ, Святослав — Чернігів, Всеволод — Переяслав."]}, {"h": "Правління наступників Ярослава Мудрого", "list": ["Ярославичі: довгий час брати придушували повстання, діяли разом; ухвалили «Правду Ярославичів» (1072 р.) — доповнення до «Руської правди», що скасувало кровну помсту за вбивство і запровадило штрафи (віру).", "Від 60-х років XI ст. на південний схід нападали кочовики-половці. 1068 р. на річці Альта половці розбили Ярославичів; у Києві піднялося повстання проти Ізяслава; владу князеві вдалося відновити лише за допомоги польського війська. 1073 р. тріумвірат розпався, почалися міжусобиці; київськими князями ставали Святослав, Всеволод, знову Ізяслав. У підсумку влада великого київського князя послабилася, зросла кількість удільних князівств та їхня самостійність."]}, {"h": "Любецький з’їзд (1097 р.)", "list": ["Відбувся за правління Святополка Ізяславича та з ініціативи переяславського князя Володимира Мономаха. Рішення: нове правило успадкування — сини успадковують князівства, що належали їхнім батькам (вотчини); володарем Русі вважається київський князь, князівські усобиці мають припинитися; удільні князі мають об'єднатися в боротьбі з половцями.", "Значення: рішення не стали обов'язковими до виконання і часто порушувались, усобиці тривали; проте князям вдалося згуртуватися на боротьбу з половцями, провідну роль в організації опору відіграв Володимир Мономах."]}, {"h": "Правління Володимира Мономаха та його сина Мстислава", "list": ["Володимир Мономах (1113–1125): онук Ярослава Мудрого і візантійського імператора; кияни самі запросили його на престол після повстання 1113 р. Відновив централізовану владу, придушив усобиці, успішно боровся з половцями. Доповнив «Руську правду» «Статутом», який обмежив відсотки за позиками й використання праці рабів. Автор «Повчання дітям» — образ ідеального правителя. Побудував у Києві міст через Дніпро. Загальмував розпад держави.", "Мстислав Володимирович (1125–1132): Мстислав Великий, останній одноосібний правитель; успішно вів політику батька; зберіг єдність держави на міжнародній арені (династичні зв'язки). Після його смерті Русь-Україна вступила в період феодальної роздробленості."]}, {"h": "Роздробленість Київської держави", "list": ["Сучасні історики витлумачують роздробленість як федеративну монархію: держава складається з досить самостійних державних утворень при збереженні єдиних законів, церкви і династії.", "Причини: розвиток вотчинного землеволодіння посилив удільних князів; панування натурального господарства зменшувало потребу в торгових контактах й об'єднанні земель; зростання міст як економічних і воєнно-політичних центрів посилювало їхнє суперництво; Київ не був нічиєю вотчиною, тому князі не прагнули його утримувати; різний етнічний склад руських територій; міжнародні торгові шляхи змістилися на захід у зв'язку з пануванням у степу кочовиків, Київ утратив роль торговельного центру.", "Наслідки: вдосконалення системи управління уділами; економічне і культурне піднесення руських земель (розвиток міст, ремесел, торгівлі, культури); Київське, Переяславське, Чернігово-Сіверське, Волинське, Галицьке князівства стали основою формування українського народу. Від 1169 р. суздальський князь Андрій Боголюбський захопив і пограбував Київ."]}, {"h": "Руські князівства часів роздробленості", "list": ["Київське — центр держави; зберігало символічну першість; боротьба за Київ між князями.", "Переяславське — слугувало щитом Русі від кочовиків, зазнавало постійних набігів половців; за смертю князя Володимира Глібовича (1187) літопис уперше вживає назву «Україна».", "Чернігівське — до середини XII ст. володіло Тмутараканню; князі мали династичні зв'язки з половцями. Новгород-Сіверське князівство: про невдалий похід князя Ігоря Святославича проти половців (1185) написано «Слово о полку Ігоревім» із закликом до об'єднання руських земель.", "Волинське — віддалене від половецького степу, мало потерпало від набігів; правили нащадки Володимира Мономаха.", "Галицьке — вийшло з-під влади Києва ще наприкінці XI ст.; найвищий розквіт за Ярослава Осмомисла (1152–1187), який контролював торгівлю по Дунаю, мав велику казну (експорт солі). Династія Ростиславичів припинилася 1199 р.; Галицько-Волинську державу створив 1199 р. Роман Мстиславович. Слово: «Галицький Осмомисле Ярославе! Високо сидиш ти на своїм золотокованім престолі...»."]}, {"h": "Суспільно-політичне та господарське життя Київської держави", "list": ["Політичний устрій: великий князь — верховний правитель і формальний власник усіх земель; право на престол мали лише Рюриковичі; удільні князі самостійно розпоряджалися землями; дружина (старша — бояри, молодша — отроки, гриді); дорадчий орган — князівська рада з бояр і старійшин; вищі посадовці в містах — тисяцькі, посадники; віче — збори чоловічого населення міста.", "Суспільство було становим. Привілейовані: князі, бояри, духівництво. Непривілейовані: смерди, наймити (рядовичі), закупи; повністю залежні — челядь, холопи, раби.", "Господарство: основа — землеробство (дво- і трипільна система, рало, соха, плуг), скотарство, садівництво, бджільництво; ремесла (чорна металургія, залізообробка, гончарство, ювелірне; XII–XIII ст. розквіт склоробства), промисли; близько 80 ремесел. Міст понад 20 у IX–X ст. (Київ, Новгород, Чернігів, Переяслав), у XII ст. — понад 200. Гроші — срібні гривні (зливки), куни, у XI ст. — власні монети.", "Торговельні шляхи: «із варяг у греки», Залізний (до Кавказу), Соляний (до Криму, на Дон і Волгу). Експортували рабів, хутро, зброю, мед, віск; завозили прянощі, скляні та ювелірні вироби, тканини, вино."]}, {"h": "Культура Київської держави", "list": ["Писемність: кирилиця і глаголиця (створені братами Кирилом і Мефодієм); кирилиця витіснила глаголицю. Школи при церквах і монастирях; перша школа в Києві — за Володимира; Анна Всеволодівна (Янка) відкрила школу для дівчаток при Андріївському монастирі.", "Києво-Печерський монастир — центр освіти і літописання, заснований Антонієм Печерським; Феодосій Печерський запровадив чернечий статут. Лікарі — Агапіт, Даміан.", "Література: «Слово про закон і благодать» (митрополит Іларіон, XI ст.); «Повість минулих літ» (Нестор, 1113 р.); «Повчання дітям» Мономаха; «Слово о полку Ігоревім» (анонім, бл. 1187 р.); «Ізборник Святослава» (1073 р.); Остромирове Євангеліє (1056–1057); Галицьке Євангеліє (1144); Києво-Печерський патерик.", "Усна народна творчість: казки, легенди, билини. Цикл про богатирів Іллю Муромця, Альошу Поповича, Добриню Микитича.", "Архітектура: хрестово-купольний тип храму; плінфа. Десятинна церква (не збереглась), Софійський собор у Києві (XI ст.), Михайлівський Золотоверхий собор (відновлений 1998 р.), Успенський собор Печерського монастиря, Спасо-Преображенський собор і П'ятницька церква в Чернігові.", "Образотворче мистецтво: мозаїки, фрески (Богоматір Оранта у Софії Київській), іконопис, книжкова мініатюра. Іконописець Алімпій. Вишгородська ікона Богоматері (Володимирська)."]}, {"h": "Значення Русі-України", "list": ["Русь-Україна вперше об'єднала східнослов'янські племена в єдиній державі, що прискорило їхній економічний, політичний і культурний розвиток, долучило до активної міжнародної політики; захистила східнослов'янські землі від кочовиків; стала бар'єром між Західною Європою і степом. Київську державу порівнюють з імперією Карла Великого."]}];
const INSTANT_FEEDBACK = true;
const TOTAL = tasks.length;
const TOPIC_ID = 3;
const LS_KEY = "hist" + TOPIC_ID + "-progress";
const summaryKey = n => "progress-topic-" + n;
let current = 0;
let inTheory = false;
const state = tasks.map(() => ({ picked: [] }));
const $ = id => document.getElementById(id);
const labelsOf = t => t.labels || LETTERS;
const correctSet = t => Array.isArray(t.correct) ? t.correct : [t.correct];
function isDone(i) {
  const t = tasks[i], p = state[i].picked;
  if (t.matrix) return p.length === t.cols.length && Array.from(p).every(x => Number.isInteger(x) && x >= 0 && x < t.options.length);
  return p.length === (t.multi || 1);
}
function isRight(i) {
  const t = tasks[i], p = state[i].picked, c = correctSet(t);
  if (t.ordered || t.matrix) return p.length === c.length && c.every((x, k) => p[k] === x);
  return p.length === c.length && c.every(x => p.includes(x));
}
try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if (saved && Array.isArray(saved.state) && saved.state.length === TOTAL) {
    saved.state.forEach((s, i) => {
      if (s && Array.isArray(s.picked) && s.picked.length <= (tasks[i].matrix ? tasks[i].cols.length : (tasks[i].multi || 1))) {
        state[i].picked = s.picked.map(x => Number.isInteger(x) && x >= 0 && x < tasks[i].options.length ? x : null);
      }
    });
    current = Number.isInteger(saved.current) ? Math.max(0, Math.min(saved.current, TOTAL - 1)) : 0;
  }
} catch (e) {}
function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ state, current }));
    const answered = state.filter((_, i) => isDone(i)).length;
    localStorage.setItem(summaryKey(TOPIC_ID), JSON.stringify({ answered, total: TOTAL }));
  } catch (e) {}
}

  t.setAttribute("aria-label", "Теорія"); t.onclick = showTheory; box.appendChild(t);
  tasks.forEach((_, i) => {
    const b = document.createElement("button"); b.className = "num";
    b.dataset.i = i; b.textContent = i + 1; b.setAttribute("aria-label", "Завдання " + (i + 1));
    b.onclick = () => go(i); box.appendChild(b);
  });
}
function paintNums() {
  [...$("nums").children].forEach(b => {
    if (b.id === "tBtn") { b.className = "num theory-btn" + (inTheory ? " current" : ""); return; }
    const i = +b.dataset.i; b.className = "num";
    if (state[i].picked.length) {
      if (INSTANT_FEEDBACK && isDone(i)) b.classList.add(isRight(i) ? "correct" : "wrong");
      else b.classList.add("answered");
    }
    if (!inTheory && i === current) b.classList.add("current");
  });
}
function buildTheory() {
  const v = $("theoryView"); v.innerHTML = '<h2 class="theory-title">Теорія до теми 3</h2>';
  theory.forEach(item => {
    const d = document.createElement("div"); d.className = "theory-block";
    const h = document.createElement("h3"); h.textContent = item.h; d.appendChild(h);
    if (item.p) { const p = document.createElement("p"); p.innerHTML = item.p; d.appendChild(p); }
    if (item.quote) { const q = document.createElement("blockquote"); q.textContent = item.quote; d.appendChild(q); }
    if (item.list) {
      const ul = document.createElement("ul");
      item.list.forEach(x => { const li = document.createElement("li"); li.innerHTML = x; ul.appendChild(li); }); d.appendChild(ul);

    if (item.after) { const p = document.createElement("p"); p.className = "after"; p.innerHTML = item.after; d.appendChild(p); }
    v.appendChild(d);

  const end = document.createElement("div"); end.className = "theory-end"; v.appendChild(end);

  const ul = $("options"); ul.innerHTML = "";

    const li = document.createElement("li");
    const pos = t.ordered ? s.picked.indexOf(i) : -1;
    let cls = t.matrix ? "option locked" : "option" + (s.picked.includes(i) ? " selected" : "");
    if (done && !t.matrix) {
      if (t.ordered) { if (pos >= 0) cls += c[pos] === i ? " right" : " wrong"; }
      else { if (c.includes(i)) cls += " right"; else if (s.picked.includes(i)) cls += " wrong"; }
      cls += " locked";
    }
    li.className = cls; li.tabIndex = t.matrix ? -1 : 0;
    li.innerHTML = '<span class="letter"></span><span class="txt"></span>';
    li.querySelector(".letter").textContent = /\bright\b/.test(cls) ? "✓" : /\bwrong\b/.test(cls) ? "✕" : labels[i];
    li.querySelector(".txt").textContent = (pos >= 0 ? "[" + (pos + 1) + "] " : "") + text;
    if (!t.matrix) {
      li.onclick = () => pick(i);
      li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(i); } };
    }
    ul.appendChild(li);
  });
  const grid = $("answerGrid"); grid.innerHTML = ""; grid.className = "answer-grid" + (t.matrix ? " matrix" : "");
  if (!t.matrix) labels.forEach((L, i) => {
    const on = s.picked.includes(i), pos = s.picked.indexOf(i);
    const col = document.createElement("div"); col.className = "answer-col";
    const b = document.createElement("b"); b.textContent = L; col.appendChild(b);
    const bx = document.createElement("button"); bx.type = "button";
    let bc = "box" + (on ? " on" : ""), mark = on ? (t.ordered ? String(pos + 1) : "✓") : "";
    if (done) {
      const ok = t.ordered ? on && c[pos] === i : c.includes(i);
      const bad = on && !ok;
      if (ok) { bc = "box right"; mark = "✓"; } else if (bad) { bc = "box wrong"; mark = "✕"; }
      bc += " locked";
    }
    bx.className = bc; bx.textContent = mark; bx.setAttribute("aria-label", "Відповідь " + L);
    bx.setAttribute("aria-pressed", String(on)); bx.setAttribute("aria-disabled", String(done));
    bx.onclick = () => pick(i); col.appendChild(bx); grid.appendChild(col);
  });
  if (t.matrix) t.cols.forEach((cl, ci) => {
    const col = document.createElement("div"); col.className = "answer-col";
    const b = document.createElement("b"); b.textContent = cl; col.appendChild(b);
    labels.forEach((L, ri) => {
      const on = s.picked[ci] === ri;
      let bc = "box" + (on ? " on" : ""), mark = L;
      if (done) {
        if (ri === c[ci]) { bc = "box right"; mark = "✓"; } else if (on) { bc = "box wrong"; mark = "✕"; }
        bc += " locked";
      }
      const bx = document.createElement("button"); bx.type = "button"; bx.className = bc; bx.textContent = mark;
      bx.setAttribute("aria-label", "Для " + cl + " — " + L); bx.setAttribute("aria-pressed", String(on)); bx.setAttribute("aria-disabled", String(done));
      bx.onclick = () => pickCell(ci, ri); col.appendChild(bx);
    });
    grid.appendChild(col);
  });
  renderExplain(t); paintNums(); save();
}
function pick(i) {
  const t = tasks[current], s = state[current];
  if (t.matrix || (INSTANT_FEEDBACK && isDone(current))) return;
  const k = s.picked.indexOf(i);
  if (k >= 0) s.picked.splice(k, 1);
  else if (t.multi) { if (s.picked.length < t.multi) s.picked.push(i); }
  else s.picked = [i];
  render();
}
function pickCell(ci, ri) {
  const s = state[current]; if (INSTANT_FEEDBACK && isDone(current)) return;
  const p = s.picked;
  if (p[ci] === ri) p[ci] = null;
  else { while (p.length <= ci) p.push(null); p[ci] = ri; }
  while (p.length && (p[p.length - 1] === null || p[p.length - 1] === undefined)) p.pop();
  render();
}
function go(i) { current = Math.max(0, Math.min(TOTAL - 1, i)); render(); window.scrollTo({ top: 0 }); }
$("skip").onclick = () => go(current + 1 >= TOTAL ? 0 : current + 1);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (inTheory || $("drawer").classList.contains("open")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); }
});
$("toTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
window.addEventListener("scroll", updateToTop, { passive: true });
$("total").textContent = TOTAL;
buildNums(); buildTheory(); render(); showTheory();

</script>
