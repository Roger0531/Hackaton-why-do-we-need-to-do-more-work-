  {
    "h": "Початок національного відродження",
    "list": []
  },
  {
    "h": "Передумови",
    "list": [
      "Реформи Марії-Терезії та Йосифа II, унаслідок яких покращилося становище греко-католицького духівництва.",
      "Молодь переймала західноєвропейські ідеї Просвітництва і романтизму в Львівському університеті.",
      "Приклад культурного розвитку польського та чеського народів."
    ]
  },
  {
    "h": "Особливості національного відродження",
    "list": [
      "Національне відродження розпочалося у Закарпатті наприкінці XVIII ст. завдяки діяльності єпископа Мукачівської греко-католицької єпархії <b>А. </b><b>Бачинського</b>, звідти перейшло на Галичину, і лише в середині XIX ст. — на Буковину.",
      "Західні українці майже повністю втратили національну еліту, яка спольщилась або мадяризувалась, тому лідерство в національному відродженні перейшло до <b>греко-католицького</b><b> </b><b>духівництва</b> — єдиного освіченого стану; як наслідок — консервативний характер українського руху.",
      "Національне відродження відбувалося під значним впливом Наддніпрянщини, але із середини XIX ст. національний рух Західної України починає випереджати рух на українських землях у складі Росії."
    ]
  },
  {
    "h": "Початок відродження на Закарпатті",
    "list": [
      "Центр просвітництва формувався навколо Ужгородської духовної (пізніше учительської) семінарії під впливом чеського, словацького, польського національних рухів.",
      "Засновників національного відродження назвали <b>будителями</b>: першим істориком Закарпаття став І. Базилович, мовознавцем — М. Лучкай, автор першої в Австрійській імперії граматики української мови.",
      "Священник <b>О. Духнович</b> сприяв уведенню української мови до програми шкільної освіти Закарпаття; став автором першого українського букваря, підручників з граматики та географії, упорядником україномовного молитовника."
    ]
  },

      "Народився в сім&#x27;ї греко-католицького священника в с. Тополі на території нинішньої Словаччини. Після смерті батька Олександр продовжив його справу. Тривалий час доводилося бідувати на різних низькооплачуваних посадах, але в 35 років Духнович став канцеляристом консисторії, що давало краще матеріальне забезпечення і доступ до архівів і бібліотек. За кілька років він обійняв посаду канонніка у Пряшеві та розгорнув свою педагогічну та літературну діяльність. Духнович збирав український фольклор і предмети побуту для музею, писав і видавав шкільні підручники, створив літературне товариство закарпатських русинів. За сімейною легендою, предок Духновича — «князь Черкаський» — утік від Петра I на Закарпаття, тож майбутнє Закарпаття він бачив у Росії, разом із Наддніпрянською Україною. Автор вірша «Я Русин був, єсьм, и буду, я родился Русином…»."
    ]

    "h": "Товариство галицьких греко-католицьких священників (1816)",

      "Український освітній і церковний діяч, один із провісників національного відродження в Галичині. Закінчивши Львівську духовну семінарію та Віденський університет, почав кар&#x27;єру сільським парафіяльним священником і відкрив першу в своєму окрузі народну школу. У 25 років Могильницький став ректором новозаснованого дяко-вчительського інституту в Перемишлі, де запровадив предмет «руська мова». Тоді ж він заснував першу на західноукраїнських землях культурно-освітню громадську організацію — «Товариство галицьких греко-католицьких священників для поширення письма, просвіти і культури серед вірних на основі християнської релігії». А ще за два роки Могильницького призначили шкільним інспектором усієї Перемишльської єпархії. Просвітник підготував і видав низку підручників українською мовою для народних шкіл: «Буквар славено-руського языка», «Катехізис», «Граматику языка слов&#x27;яно-руського» тощо. Він першим серед західноукраїнських мовознавців обґрунтував положення про самостійність і самобутність української мови. Помер учений під час епідемії холери."

      "Народився в с. Підлисся на Галичині в родині священника. Був вільним слухачем у Львівському університеті, закінчив Львівську семінарію. У студентські роки заснував просвітницький гурток молоді «Руська трійця». Після закінчення семінарії працював парафіяльним священником у селах Львівщини. Через бідність і туберкульоз рано помер; його було поховано на Личаківському цвинтарі у Львові. Для галицької історії особистість Маркіяна Шашкевича значуща так само, як Тараса Шевченка для Наддніпрянщини."

      "Народився в с. Чепелі на Львівщині в священицькій родині. Під час навчання у Львівському університеті став співзасновником «Руської трійці». Завдяки його зв&#x27;язкам у Будапешті вдалося видати «Русалку Дністровую». Тривалий час уважався неблагонадійним, однак все одно підготував ще один український альманах «Вінок русинам на обжинки» (1847). Під час революції 1848 року очолив новостворену кафедру української мови Львівського університету, був учасником Собору руських учених. У 46 років став ректором Львівського університету. Але свої українські переконання зрадив, уважаючи українців частиною російського народу, і навіть переїхав до Російської імперії."

      "Народився в сім&#x27;ї пароха на Станіславщині (Івано-Франківщині). Студентом Львівської семінарії брав участь у польських підпільних організаціях. У 1830-ті роки як учасник «Руської трійці» став співавтором альманаху гуртка. Через цю діяльність Вагилевича висвятили на священика лише через сім років після того, як він закінчив семінарію. Під час революції 1848 р. він залишив посаду священика і переїхав до Львова. Тоді ж він зайняв польські позиції і перейшов у лютеранство, але через це втратив підтримку покровителів-католиків. За чотири роки до смерті став міським архіваріусом Львова. Залишив по собі великий доробок етнографічних досліджень Галичини."

      "М. Шашкевич підготував першу українську «Читанку» (1836) — підручник для молодших школярів; навіть термін «читанка» належить Шашкевичу.",

      "Ватажок народних повстань на Буковині, депутат австрійського парламенту. Народився в сім&#x27;ї селянина-кріпака. У 27 років селяни обрали його уповноваженим, якому доручалося відстоювати громадські інтереси. Побачивши безрезультатність звернень до владних органів, він у 1843–1844 рр. очолив виступи селян 22 громад, які відмовлялися відробляти панщину, самочинно переобирали сільську старшину, висували вимоги відкриття українських шкіл, вільного користування лісами і пасовиськами, надання їм статусу державних селян. Повстання було придушене за допомогою урядових військ, а Кобилицю заарештовано і ув&#x27;язнено. Під час революції 1848–1849 років в Австрійській імперії селяни Буковини обрали його депутатом парламенту, де Кобилиця виступив за надання політичної автономії Буковині і приєднання її до Галичини, вимагав скасування кріпацтва і передачу селянам землі без викупу. У листопаді 1848 р. на зборах у Вижниці він закликав селян до повстання; виступи під його керівництвом тривали до літа 1849. За два роки Кобилицю знову заарештували; після катувань в ув&#x27;язненні його вислали до міста Гура-Гумора, де селянський ватажок і помер."

fnmiigD//Z\" alt=\"Ілюстрація з документа\">",
      "Засновник Харківського університету, вчений і винахідник. Народився на Харківщині в дворянській родині. У 25 років був затриманий під час спроби таємно виїхати до Європи разом із дружиною-кріпачкою. Каразіну належить ідея про створення одного з перших у Європі Міністерства народної освіти. У родовому маєтку він мав хімічну лабораторію й метеорологічну станцію — першу в Харківській губернії. Там же була й велика бібліотека, народна школа, заснована ним сільська дума, що надавала самоврядування кріпакам, які дістали у спадкове володіння землі. З ініціативи Василя Назаровича на кошти місцевого дворянства і купецтва було засновано Харківський університет. Також ним було створене Філотехнічне товариство. За критику суспільного ладу Каразін був ув&#x27;язнений у Шліссельбурзькій фортеці, а після звільнення жив під наглядом поліції у своєму маєтку. Помер у Миколаєві, де і похований."

      "Перший ректор Київського університету, вчений-мовознавець, ботанік. Народився в родині сільського судді на хуторі Тимківщина на Черкащині. У 19 років закінчив Московський університет, де навчався на словесному і природничому відділах. Через десять років став доктором наук і професором кафедри ботаніки. 1834 р. Максимович очолив новостворений Київський університет св. Володимира. Був почесним членом багатьох наукових товариств та університетів. Учений-енциклопедист, він підтримував стосунки з Т. Шевченком, М. Костомаровим, П. Гулаком-Артемовським тощо. Видані ним збірки українського фольклору знані далеко за межами України. Займався вивченням «Руської правди», «Слова о полку Ігоревім», «Повісті минулих літ»; не оминув своєю увагою археологію та історію. Також Максимович — один із зачинателів української ботаніки. 1840 р. учений залишив державну службу через погіршення здоров&#x27;я і зайнявся науковою роботою. Помер на своєму хуторі Михайлова Гора."

      "Видатний український математик. Походив із родини збіднілих дворян Полтавщини. Незважаючи на мрію стати військовим, у 15 років вступив до Харківського університету. Захоплення математикою значною мірою сприяло його зближенню з ректором — професором Т. Осиповським. Остроградський блискуче закінчив університет, але ступінь йому не надали. Молодий учений вирушив на навчання до Парижа, а потім повернувся до Петербурга вже відомим математиком. 27-річний Остроградський став академіком Петербурзької академії наук, згодом — дійсним членом ряду інших академій: Римської, Туринської, Американської, кореспондентом Паризької академії наук, почесним членом Київського та Московського університетів та багатьох наукових товариств. Учений займався аналітичною механікою, теорією удару, балістикою, варіаційним численням, алгеброю, теорією чисел, теорією ймовірностей. Одного з його учнів писали, що ученого можна назвати центром усієї математичної діяльності в Росії."

      "Програмним твором для поколінь патріотів стала <b>«</b><b>Історія</b><b> </b><b>русів</b><b>»</b> — анонімний історичний твір початку XIX ст., авторство якого приписують автономістам Г. Конінському та Г. Полетиці. Вона ходила в рукописних списках, які не контролювалися цензурою, адже погляди автора не відповідали офіційним. Україна визнавалася прямою спадкоємицею Київської Русі, а Національно-визвольна війна під проводом Б. Хмельницького була справедливою боротьбою. З погляду «Історії русів», Москва порушила умови «Березневих статей» 1654 р., а повстання І. Мазепи було реакцією на гноблення російських царів. І. Виговський, Д. Многогрішний, П. Полуботок названі захисниками української держави. «Історія русів» — не стільки історичний твір, скільки політичний, який обґрунтовував національну ідею України."

const TOTAL=tasks.length,TOPIC_ID='13-14',LS_KEY='hist'+TOPIC_ID+'-progress';
const $=id=>document.getElementById(id),labelsOf=t=>t.labels||['А','Б','В','Г'],correctSet=t=>Array.isArray(t.correct)?t.correct:[t.correct];
let current=0,inTheory=false;const state=tasks.map(()=>({picked:[]}));
function isDone(i){const t=tasks[i],p=state[i].picked;return t.matrix?p.length===4&&p.every(Number.isInteger):p.length===(t.multi||1);}
function isRight(i){const t=tasks[i],p=state[i].picked,c=correctSet(t);return p.length===c.length&&(t.matrix||t.ordered?c.every((x,k)=>p[k]===x):c.every(x=>p.includes(x)));}
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&Array.isArray(s.state)&&s.state.length===TOTAL){s.state.forEach((v,i)=>{if(!v||!Array.isArray(v.picked))return;const t=tasks[i],p=v.picked;if(p.length<=(t.multi||1)&&p.every(x=>(t.matrix&&x===null)||(Number.isInteger(x)&&x>=0&&x<t.options.length))&&(t.matrix||new Set(p).size===p.length))state[i].picked=p;});if(Number.isInteger(s.current))current=Math.max(0,Math.min(TOTAL-1,s.current));}}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify({state,current}));localStorage.setItem('progress-topic-'+TOPIC_ID,JSON.stringify({answered:state.filter((_,i)=>isDone(i)).length,total:TOTAL}));}catch(e){}}
function buildNums(){const box=$('nums');const b=document.createElement('button');b.id='tBtn';b.className='num theory-btn';b.textContent='Т';b.setAttribute('aria-label','Теорія');b.onclick=showTheory;box.appendChild(b);tasks.forEach((_,i)=>{const b=document.createElement('button');b.className='num';b.dataset.i=i;b.textContent=i+1;b.setAttribute('aria-label','Завдання '+(i+1));b.onclick=()=>go(i);box.appendChild(b);});}
function paintNums(){[...$('nums').children].forEach(b=>{if(b.id==='tBtn'){b.className='num theory-btn'+(inTheory?' current':'');return;}const i=+b.dataset.i;b.className='num';if(state[i].picked.length)b.classList.add(isDone(i)?isRight(i)?'correct':'wrong':'answered');if(!inTheory&&current===i)b.classList.add('current');});}
function buildTheory(){const v=$('theoryView');v.innerHTML='<h2 class="theory-title">Теорія</h2>';theory.forEach((item,i)=>{const d=document.createElement('div');d.className='theory-block';d.id='theory-'+i;const h=document.createElement('h3');h.textContent=item.h;d.appendChild(h);const ul=document.createElement('ul');item.list.forEach(x=>{const li=document.createElement('li');li.innerHTML=x;ul.appendChild(li);});d.appendChild(ul);v.appendChild(d);});}
function updateToTop(){$('toTop').classList.toggle('show',inTheory&&window.scrollY>200);}
function showTheory(){inTheory=true;$('testView').classList.add('hidden');$('theoryView').classList.remove('hidden');$('counter').textContent='Теорія';paintNums();window.scrollTo({top:0});updateToTop();}
function showTheoryAt(i){showTheory();$('theory-'+i).scrollIntoView({behavior:'smooth',block:'start'});}
function renderExplain(t){const box=$('explain');if(!isDone(current)){box.className='explain hidden';box.innerHTML='';return;}const right=isRight(current),labels=labelsOf(t),c=correctSet(t);const ans=t.matrix?c.map((x,k)=>(k+1)+'–'+labels[x]).join(', '):c.map(x=>labels[x]).join(t.ordered?' → ':', ');box.className='explain '+(right?'good':'bad');box.innerHTML='<div class="score">Правильна відповідь: <b>'+ans+'</b>. Бали: '+(right?1:0)+' з 1. Після показу відповіді змінити її вже не можна.</div><h4>Чому так</h4><p class="why"></p><p class="repeat">Повторити: <a href="#" id="repeatLink"></a></p>';box.querySelector('.why').textContent=t.matrix?c.map((x,k)=>(k+1)+' — '+t.options[x]).join('; ')+'.':t.ordered?'Послідовність за позначками в документі: '+c.map(x=>t.options[x]).join(' → ')+'.':'Правильна відповідь за підкресленням у документі: '+t.options[c[0]]+'.';const a=$('repeatLink');a.textContent=theory[t.repeat].h;a.onclick=e=>{e.preventDefault();showTheoryAt(t.repeat);};}
function render(){inTheory=false;updateToTop();$('theoryView').classList.add('hidden');$('testView').classList.remove('hidden');const t=tasks[current],p=state[current].picked,labels=labelsOf(t),done=isDone(current),c=correctSet(t);$('counter').textContent='Завдання '+(current+1)+' з '+TOTAL;const q=$('question');q.textContent='';const b=document.createElement('b');b.textContent=t.id+' ';q.append(b,document.createTextNode(t.q));$('answersLabel').textContent=t.matrix?'Установіть відповідності для кожного стовпця:':t.ordered?'Позначте події у правильній послідовності (потрібно обрати 4):':'Позначте відповіді:';
const iv=$('questionImages');iv.innerHTML='';t.images.forEach(src=>{const img=document.createElement('img');img.className='material-image';img.src=src;img.alt='Ілюстрація до завдання '+t.id;iv.appendChild(img);});
const ul=$('options');ul.innerHTML='';t.options.forEach((text,i)=>{const li=document.createElement('li'),pos=t.ordered?p.indexOf(i):-1;let cls=t.matrix?'option locked':'option'+(p.includes(i)?' selected':'');if(done&&!t.matrix){if(t.ordered){if(pos>=0)cls+=c[pos]===i?' right':' wrong';}else if(c.includes(i))cls+=' right';else if(p.includes(i))cls+=' wrong';cls+=' locked';}li.className=cls;li.tabIndex=t.matrix?-1:0;li.innerHTML='<span class="letter"></span><span class="txt"></span>';li.querySelector('.letter').textContent=/\bright\b/.test(cls)?'✓':/\bwrong\b/.test(cls)?'✕':labels[i];li.querySelector('.txt').textContent=(pos>=0?'['+(pos+1)+'] ':'')+text;if(!t.matrix){li.setAttribute('role','button');li.setAttribute('aria-disabled',String(done));li.onclick=()=>pick(i);li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(i);}};}ul.appendChild(li);});
const grid=$('answerGrid');grid.innerHTML='';grid.className='answer-grid'+(t.matrix?' matrix':'');function cell(col,label,on,ok,bad,mark,action){const bx=document.createElement('button');bx.className='box'+(done?(ok?' right':bad?' wrong':'')+' locked':on?' on':'');bx.textContent=done?(ok?'✓':bad?'✕':mark):mark;bx.setAttribute('aria-label',label);bx.setAttribute('aria-pressed',String(on));bx.setAttribute('aria-disabled',String(done));bx.onclick=action;col.appendChild(bx);}if(t.matrix){['1','2','3','4'].forEach((cl,ci)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=cl;col.appendChild(b);labels.forEach((L,ri)=>{const on=p[ci]===ri;cell(col,'Для '+cl+' — '+L,on,c[ci]===ri,on&&c[ci]!==ri,L,()=>pickCell(ci,ri));});grid.appendChild(col);});}else{labels.forEach((L,i)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=L;col.appendChild(b);const on=p.includes(i),pos=p.indexOf(i),ok=t.ordered?on&&c[pos]===i:c.includes(i);cell(col,'Відповідь '+L,on,ok,on&&!ok,on?(t.ordered?String(pos+1):'✓'):'',()=>pick(i));grid.appendChild(col);});}renderExplain(t);paintNums();save();}
function pick(i){if(isDone(current))return;const t=tasks[current],s=state[current],k=s.picked.indexOf(i);if(k>=0)s.picked.splice(k,1);else if(t.multi){if(s.picked.length<t.multi)s.picked.push(i);}else s.picked=[i];render();}
function pickCell(ci,ri){if(isDone(current))return;const p=state[current].picked;if(p[ci]===ri)p[ci]=null;else{while(p.length<=ci)p.push(null);p[ci]=ri;}while(p.length&&p[p.length-1]==null)p.pop();render();}
function go(i){current=Math.max(0,Math.min(TOTAL-1,i));render();window.scrollTo({top:0});}
$('skip').onclick=()=>go(current+1>=TOTAL?0:current+1);$('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',updateToTop,{passive:true});document.addEventListener('keydown',e=>{if(inTheory||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1);}});$('total').textContent=TOTAL;buildNums();buildTheory();render();showTheory();
</script></body></html>
