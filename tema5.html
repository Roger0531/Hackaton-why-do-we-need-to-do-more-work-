  t.textContent = "Т"; t.setAttribute("aria-label", "Теорія"); t.onclick = showTheory; box.appendChild(t);
  tasks.forEach((_, i) => {
    const b = document.createElement("button"); b.className = "num"; b.dataset.i = i;
    b.textContent = i + 1; b.setAttribute("aria-label", "Завдання " + (i + 1)); b.onclick = () => go(i); box.appendChild(b);
  });
}
function paintNums() {
  [...$("nums").children].forEach(b => {
    if (b.id === "tBtn") { b.className = "num theory-btn" + (inTheory ? " current" : ""); return; }
    const i = +b.dataset.i; b.className = "num";
    if (state[i].picked.length) {
      if (INSTANT_FEEDBACK && isDone(i)) b.classList.add(isRight(i) ? "correct" : "wrong");
      else b.classList.add("answered");
    }
    if (!inTheory && i === current) b.classList.add("current");
  });
}
function buildTheory() {
  const v = $("theoryView"); v.innerHTML = '<h2 class="theory-title">Теорія до теми 5</h2>';
  theory.forEach(item => {
    const d = document.createElement("div"); d.className = "theory-block";
    const h = document.createElement("h3"); h.textContent = item.h; d.appendChild(h);
    if (item.p) { const p = document.createElement("p"); p.innerHTML = item.p; d.appendChild(p); }
    if (item.quote) { const q = document.createElement("blockquote"); q.textContent = item.quote; d.appendChild(q); }
    if (item.list) {
      const ul = document.createElement("ul");
      item.list.forEach(x => { const li = document.createElement("li"); li.innerHTML = x; ul.appendChild(li); }); d.appendChild(ul);
    }
    if (item.after) { const p = document.createElement("p"); p.className = "after"; p.innerHTML = item.after; d.appendChild(p); }
    v.appendChild(d);
  });
  const end = document.createElement("div"); end.className = "theory-end"; v.appendChild(end);
}
function updateToTop() {
  const show = inTheory && window.scrollY > 200; $("toTop").classList.toggle("show", show);
}
function showTheory() {
  inTheory = true; $("testView").classList.add("hidden"); $("theoryView").classList.remove("hidden");
  $("counter").textContent = "Теорія"; paintNums(); window.scrollTo({ top: 0 }); updateToTop();
}
function render() {
  inTheory = false; updateToTop(); $("theoryView").classList.add("hidden"); $("testView").classList.remove("hidden");
  const t = tasks[current], s = state[current], labels = labelsOf(t), done = INSTANT_FEEDBACK && isDone(current);
  $("counter").textContent = "Завдання " + (current + 1) + " з " + TOTAL;
  const q = $("question"); q.textContent = "";
  const idEl = document.createElement("b"); idEl.textContent = t.id + " "; q.appendChild(idEl); q.appendChild(document.createTextNode(t.q));
  if (t.note) { const em = document.createElement("em"); em.textContent = t.note; q.appendChild(em); }
  $("answersLabel").textContent = t.hint || (t.multi ? "Позначте відповіді (потрібно обрати " + t.multi + "):" : "Позначте відповіді:");
  const ul = $("options"); ul.innerHTML = "";
  t.options.forEach((text, i) => {
    const li = document.createElement("li"), pos = t.ordered ? s.picked.indexOf(i) : -1;
    let cls = t.matrix ? "option locked" : "option" + (s.picked.includes(i) ? " selected" : "");
    if (done && !t.matrix) {
      if (t.ordered) { if (pos >= 0) cls += correctSet(t)[pos] === i ? " right" : " wrong"; }
      else { if (correctSet(t).includes(i)) cls += " right"; else if (s.picked.includes(i)) cls += " wrong"; }
      cls += " locked";
    }
    li.className = cls; li.tabIndex = t.matrix ? -1 : 0;
    li.innerHTML = '<span class="letter"></span><span class="txt"></span>';
    li.querySelector(".letter").textContent = /\bright\b/.test(cls) ? "✓" : /\bwrong\b/.test(cls) ? "✕" : labels[i];
    li.querySelector(".txt").textContent = (pos >= 0 ? "[" + (pos + 1) + "] " : "") + text;
    if (!t.matrix) {
      li.onclick = () => pick(i);
      li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(i); } };
    }
    ul.appendChild(li);
  });
  const grid = $("answerGrid"); grid.innerHTML = ""; grid.className = "answer-grid" + (t.matrix ? " matrix" : "");
  (t.matrix ? [] : labels).forEach((L, i) => {
    const on = s.picked.includes(i), pos = s.picked.indexOf(i);
    const col = document.createElement("div"); col.className = "answer-col";
    const b = document.createElement("b"); b.textContent = L;
    const bx = document.createElement("button");
    let bc = "box" + (on ? " on" : ""), mark = on ? (t.ordered ? String(pos + 1) : "✓") : "";
    if (done) {
      let ok, bad;
      if (t.ordered) { ok = on && correctSet(t)[pos] === i; bad = on && !ok; }
      else { ok = correctSet(t).includes(i); bad = !ok && on; }
      if (ok) { bc = "box right"; mark = "✓"; } else if (bad) { bc = "box wrong"; mark = "✕"; }
      bc += " locked";
    }
    bx.className = bc; bx.textContent = mark; bx.setAttribute("aria-label", "Відповідь " + L); bx.onclick = () => pick(i);
    col.appendChild(b); col.appendChild(bx); grid.appendChild(col);
  });
  if (t.matrix) {
    const c = correctSet(t);
    t.cols.forEach((cl, ci) => {
      const col = document.createElement("div"); col.className = "answer-col";
      const b = document.createElement("b"); b.textContent = cl; col.appendChild(b);
      labels.forEach((L, ri) => {
        const on = s.picked[ci] === ri; let bc = "box" + (on ? " on" : ""), mark = L;
        if (done) {
          if (ri === c[ci]) { bc = "box right"; mark = "✓"; } else if (on) { bc = "box wrong"; mark = "✕"; }
          bc += " locked";
        }
        const bx = document.createElement("button"); bx.className = bc; bx.textContent = mark;
        bx.setAttribute("aria-label", "Для " + cl + " — " + L); bx.onclick = () => pickCell(ci, ri); col.appendChild(bx);
      }); grid.appendChild(col);
    });
  }
  renderExplain(t); paintNums(); save();
}
function pickCell(ci, ri) {
  const s = state[current]; if (INSTANT_FEEDBACK && isDone(current)) return;
  const p = s.picked;
  if (p[ci] === ri) p[ci] = null;
  else { while (p.length <= ci) p.push(null); p[ci] = ri; }
  while (p.length && (p[p.length - 1] === null || p[p.length - 1] === undefined)) p.pop(); render();
}
function pick(i) {
  const t = tasks[current], s = state[current]; if (INSTANT_FEEDBACK && isDone(current)) return;
  const k = s.picked.indexOf(i);
  if (k >= 0) s.picked.splice(k, 1);
  else if (t.multi) { if (s.picked.length < t.multi) s.picked.push(i); }
  else s.picked = [i]; render();
}
function go(i) { current = Math.max(0, Math.min(TOTAL - 1, i)); render(); window.scrollTo({ top: 0 }); }
$("skip").onclick = () => go(current + 1 >= TOTAL ? 0 : current + 1);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (inTheory || $("drawer").classList.contains("open")) return;
  if (e.key === "ArrowRight") go(current + 1); if (e.key === "ArrowLeft") go(current - 1);
});
$("toTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
window.addEventListener("scroll", updateToTop, { passive: true });
$("total").textContent = TOTAL;
buildNums(); buildTheory(); render(); showTheory();
</script></body></html>
