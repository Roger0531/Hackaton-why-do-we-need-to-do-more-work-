      "<b>Юліан</b><b> Романчук (1842–1932)</b> — громадський і політичний діяч. Майже сорок років працював учителем львівської гімназії. Його життя було тісно пов&#x27;язане з народовським рухом: Романчука ми бачимо серед засновників «Просвіти», Наукового товариства ім. Т. Шевченка, газети «Діло», Української національно-демократичної партії. У 1880-ті він стає послом до Галицького сейму, тоді ж ініціює створення Народної Ради, а 1890 р. бере участь у створенні політики Нової ери. Романчук брав участь і в роботі австрійського парламенту, очолював Українську парламентську репрезентацію і навіть був віцепрезидентом парламенту. Уже 1918 р. був членом Української національної ради ЗУНР.",
      "1880 р. були скликані перші масові українські збори (віче), де обговорювалися економічні проблеми селянства, політичне становище українців, стан освіти."
    ]

      "<b>Юрій</b><b> Федькович (1834–1888)</b> — український письменник і громадський діяч. Народився в небагатій шляхетській родині, дід по материній лінії був греко-католицьким священиком. Понад десять років віддав військовій службі, тоді ж почав писати вірші українською мовою, щоправда, латинською абеткою. Після звільнення працював війтом, шкільним інспектором, поки його не запросили до Львова редактором у «Просвіті» і театр «Руської бесіди». Друкував свої твори у народовських часописах. Повернувшись на батьківщину, редагував газету «Буковина». Почесний член Наукового товариства ім. Т. Шевченка."

      "Загострення відносин між Австро-Угорщиною та Росією, що не могли поділити Балкани на сфери впливу й мали взаємні територіальні претензії, змусило уряд Австро-Угорщини заручитися підтримкою українців і припинити українсько-польське протистояння в Галичині.",

    "h": "Зміст нової ери",

      "<b>Іван</b><b> Франко (1856–1916)</b> народився в с. Нагуєвичі на Львівщині. Після закінчення Дрогобицької гімназії вступив на філософський факультет Львівського університету. За оповідання про життя бориславських нафтовиків Франко навіть кілька місяців провів у в&#x27;язниці. Разом із М. Павликом видавав журнали «Громадський друг», «Дзвін», «Світ», де публікував нові твори. У 1880-х роках Франко кілька разів нелегально відвідав Київ, де встановив контакти з діячами громади та одружився з Ольгою Хоружинською. 1893 р. він одержав вчений ступінь доктора філософії. Щоправда, очолити кафедру Львівського університету Франкові не дали.",
      "1890 р. за підтримки М. Драгоманова Франко стає співзасновником Русько-української радикальної партії, підготувавши для неї програму, та разом з М. Павликом видає часопис «Народ». РУРП неодноразово висувала кандидатуру Франка на посла віденського парламенту і галицького сейму, але через виборчі маніпуляції адміністрації і провокації ідеологічних і політичних супротивників — без успіху. 1899 р. РУРП розкололася, Франко спільно з народовцями заснував Українську національно-демократичну партію.",
      "Іванові Франку належить ініціатива ширшого вживання в Галичині назви «українці» замість «русини». 1905 р. його обирають членом Чеського наукового товариства, 1906 р. Харківський університет надає ступінь доктора наук, а 1916 р. Російська академія наук присуджує премію за працю «Студії над українською народною піснею». Помер І. Франко на чужих руках — сини були в армії, дочка в Києві, дружина в лікарні. Поховали видатного діяча у Львові на Личаківському цвинтарі.",
      "<b>1895 р.</b> український соціал-демократ <b>Ю. </b><b>Бачинський</b> опублікував брошуру «<b>Україна</b><b> irredenta</b>» («Україна уярмлена»), де обґрунтував ідею створення незалежної Української держави і довів, що саме незалежність є необхідною умовою її економічного та культурного розвитку."
    ]

      "<b>Юліан</b><b> </b><b>Бачинський</b><b> (1870–1940)</b> — український політичний і громадський діяч, публіцист, член Української радикальної та Української соціал-демократичної партій. Народився на Тернопільщині в родині греко-католицького священика. Навчався на юридичному факультеті Львівського та Берлінського університетів. 1895 р. опублікував книгу «Україна уярмлена», у якій обґрунтував потребу створення української соборної держави. У подальшому Ю. Бачинський брав участь у подіях Української революції, після її поразки мешкав у Німеччині, Львові, а 1932 р. перебрався до Києва. За два роки його звинуватили в антирадянській терористичній діяльності та засудили до 10-річного ув&#x27;язнення. У таборах ГУЛагу Бачинський і помер."

function isRight(i){const t=tasks[i],p=state[i].picked,c=correctSet(t);return p.length===c.length&&(t.matrix||t.ordered?c.every((x,k)=>p[k]===x):c.every(x=>p.includes(x)));}
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&Array.isArray(s.state)&&s.state.length===TOTAL){s.state.forEach((v,i)=>{if(!v||!Array.isArray(v.picked))return;const t=tasks[i],p=v.picked;if(p.length<=(t.multi||1)&&p.every(x=>(t.matrix&&x===null)||(Number.isInteger(x)&&x>=0&&x<t.options.length))&&(t.matrix||new Set(p).size===p.length))state[i].picked=p;});if(Number.isInteger(s.current))current=Math.max(0,Math.min(TOTAL-1,s.current));}}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify({state,current}));localStorage.setItem('progress-topic-'+TOPIC_ID,JSON.stringify({answered:state.filter((_,i)=>isDone(i)).length,total:TOTAL}));}catch(e){}}
function buildNums(){const box=$('nums');const b=document.createElement('button');b.id='tBtn';b.className='num theory-btn';b.textContent='Т';b.setAttribute('aria-label','Теорія');b.onclick=showTheory;box.appendChild(b);tasks.forEach((_,i)=>{const b=document.createElement('button');b.className='num';b.dataset.i=i;b.textContent=i+1;b.setAttribute('aria-label','Завдання '+(i+1));b.onclick=()=>go(i);box.appendChild(b);});}
function paintNums(){[...$('nums').children].forEach(b=>{if(b.id==='tBtn'){b.className='num theory-btn'+(inTheory?' current':'');return;}const i=+b.dataset.i;b.className='num';if(state[i].picked.length)b.classList.add(isDone(i)?isRight(i)?'correct':'wrong':'answered');if(!inTheory&&current===i)b.classList.add('current');});}
function buildTheory(){const v=$('theoryView');v.innerHTML='<h2 class="theory-title">Теорія</h2>';theory.forEach((item,i)=>{const d=document.createElement('div');d.className='theory-block';d.id='theory-'+i;const h=document.createElement('h3');h.textContent=item.h;d.appendChild(h);const ul=document.createElement('ul');item.list.forEach(x=>{const li=document.createElement('li');li.innerHTML=x;ul.appendChild(li);});d.appendChild(ul);v.appendChild(d);});}
function updateToTop(){$('toTop').classList.toggle('show',inTheory&&window.scrollY>200);}
function showTheory(){inTheory=true;$('testView').classList.add('hidden');$('theoryView').classList.remove('hidden');$('counter').textContent='Теорія';paintNums();window.scrollTo({top:0});updateToTop();}
function showTheoryAt(i){showTheory();$('theory-'+i).scrollIntoView({behavior:'smooth',block:'start'});}
function renderExplain(t){const box=$('explain');if(!isDone(current)){box.className='explain hidden';box.innerHTML='';return;}const right=isRight(current),labels=labelsOf(t),c=correctSet(t);const ans=t.matrix?c.map((x,k)=>(k+1)+'–'+labels[x]).join(', '):c.map(x=>labels[x]).join(t.ordered?' → ':', ');box.className='explain '+(right?'good':'bad');box.innerHTML='<div class="score">Правильна відповідь: <b>'+ans+'</b>. Бали: '+(right?1:0)+' з 1. Після показу відповіді змінити її вже не можна.</div><h4>Чому так</h4><p class="why"></p><p class="repeat">Повторити: <a href="#" id="repeatLink"></a></p>';box.querySelector('.why').textContent=t.matrix?c.map((x,k)=>(k+1)+' — '+t.options[x]).join('; ')+'.':t.ordered?'Послідовність за позначками в документі: '+c.map(x=>t.options[x]).join(' → ')+'.':'Правильна відповідь за ключем документа: '+c.map(x=>t.options[x]).join('; ')+'.';const a=$('repeatLink');a.textContent=theory[t.repeat].h;a.onclick=e=>{e.preventDefault();showTheoryAt(t.repeat);};}
function render(){inTheory=false;updateToTop();$('theoryView').classList.add('hidden');$('testView').classList.remove('hidden');const t=tasks[current],p=state[current].picked,labels=labelsOf(t),done=isDone(current),c=correctSet(t);$('counter').textContent='Завдання '+(current+1)+' з '+TOTAL;const q=$('question');q.textContent='';const b=document.createElement('b');b.textContent=t.id+' ';q.append(b,document.createTextNode(t.q));$('answersLabel').textContent=t.matrix?'Установіть відповідності для кожного стовпця:':t.ordered?'Позначте події у правильній послідовності (потрібно обрати 4):':t.multi?'Позначте відповіді (потрібно обрати '+t.multi+'):':'Позначте відповіді:';
const iv=$('questionImages');iv.innerHTML='';t.images.forEach(src=>{const img=document.createElement('img');img.className='material-image';img.src=src;img.alt='Ілюстрація до завдання '+t.id;iv.appendChild(img);});
const ul=$('options');ul.innerHTML='';t.options.forEach((text,i)=>{const li=document.createElement('li'),pos=t.ordered?p.indexOf(i):-1;let cls=t.matrix?'option locked':'option'+(p.includes(i)?' selected':'');if(done&&!t.matrix){if(t.ordered){if(pos>=0)cls+=c[pos]===i?' right':' wrong';}else if(c.includes(i))cls+=' right';else if(p.includes(i))cls+=' wrong';cls+=' locked';}li.className=cls;li.tabIndex=t.matrix?-1:0;li.innerHTML='<span class="letter"></span><span class="txt"></span>';li.querySelector('.letter').textContent=/\bright\b/.test(cls)?'✓':/\bwrong\b/.test(cls)?'✕':labels[i];li.querySelector('.txt').textContent=(pos>=0?'['+(pos+1)+'] ':'')+text;if(!t.matrix){li.setAttribute('role','button');li.setAttribute('aria-disabled',String(done));li.onclick=()=>pick(i);li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(i);}};}ul.appendChild(li);});
const grid=$('answerGrid');grid.innerHTML='';grid.className='answer-grid'+(t.matrix?' matrix':'');function cell(col,label,on,ok,bad,mark,action){const bx=document.createElement('button');bx.className='box'+(done?(ok?' right':bad?' wrong':'')+' locked':on?' on':'');bx.textContent=done?(ok?'✓':bad?'✕':mark):mark;bx.setAttribute('aria-label',label);bx.setAttribute('aria-pressed',String(on));bx.setAttribute('aria-disabled',String(done));bx.onclick=action;col.appendChild(bx);}if(t.matrix){['1','2','3','4'].forEach((cl,ci)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=cl;col.appendChild(b);labels.forEach((L,ri)=>{const on=p[ci]===ri;cell(col,'Для '+cl+' — '+L,on,c[ci]===ri,on&&c[ci]!==ri,L,()=>pickCell(ci,ri));});grid.appendChild(col);});}else{labels.forEach((L,i)=>{const col=document.createElement('div');col.className='answer-col';const b=document.createElement('b');b.textContent=L;col.appendChild(b);const on=p.includes(i),pos=p.indexOf(i),ok=t.ordered?on&&c[pos]===i:c.includes(i);cell(col,'Відповідь '+L,on,ok,on&&!ok,on?(t.ordered?String(pos+1):'✓'):'',()=>pick(i));grid.appendChild(col);});}renderExplain(t);paintNums();save();}
function pick(i){if(isDone(current))return;const t=tasks[current],s=state[current],k=s.picked.indexOf(i);if(k>=0)s.picked.splice(k,1);else if(t.multi){if(s.picked.length<t.multi)s.picked.push(i);}else s.picked=[i];render();}
function pickCell(ci,ri){if(isDone(current))return;const p=state[current].picked;if(p[ci]===ri)p[ci]=null;else{while(p.length<=ci)p.push(null);p[ci]=ri;}while(p.length&&p[p.length-1]==null)p.pop();render();}
function go(i){current=Math.max(0,Math.min(TOTAL-1,i));render();window.scrollTo({top:0});}
$('skip').onclick=()=>go(current+1>=TOTAL?0:current+1);$('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',updateToTop,{passive:true});document.addEventListener('keydown',e=>{if(inTheory||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1);}});$('total').textContent=TOTAL;buildNums();buildTheory();render();showTheory();
</script></body></html>
